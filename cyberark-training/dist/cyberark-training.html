<!doctype html>
<html lang="ja" data-root="" data-page="index.html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberArk 新人研修</title>
<meta name="description" content="CyberArk（Idira）PAMの基礎から設計・運用まで学ぶ新人研修（全ページ1ファイル版）">
<style>
/* =========================================================
   CyberArk 新人研修サイト 共通スタイル
   - ライト/ダーク両対応（:root トークン）
   - PC / スマートフォン両対応（16px ガター、横スクロールなし）
   ========================================================= */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #eef1f7;
  --text: #1c2333;
  --text-sub: #5a6478;
  --line: #d4d9e4;
  --accent: #1f5fd1;
  --accent-soft: #e3ecfd;
  --accent-text: #ffffff;
  --ok: #1b7f4b;
  --ok-soft: #e2f4ea;
  --ng: #c0392b;
  --ng-soft: #fbe6e3;
  --warn: #a8640a;
  --warn-soft: #fdf1dc;
  --info: #5b3fc4;
  --info-soft: #ece7fb;
  --vault: #8a5a00;
  --vault-soft: #fff3d6;
  --threat: #b4232a;
  --threat-soft: #fde4e4;
  --cloud: #0b7a8a;
  --cloud-soft: #dff4f6;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 16px rgba(20, 30, 60, .06);
  --radius: 12px;
  --header-h: 56px;
  --sidebar-w: 280px;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d;
    --surface: #181e29;
    --surface-2: #212938;
    --text: #e6e9f0;
    --text-sub: #9aa4b8;
    --line: #333d50;
    --accent: #6ea0ff;
    --accent-soft: #1d2c4a;
    --accent-text: #0d1320;
    --ok: #4cc58a;
    --ok-soft: #15301f;
    --ng: #ff7b6e;
    --ng-soft: #3a1c1a;
    --warn: #f0b04f;
    --warn-soft: #382a12;
    --info: #a996ff;
    --info-soft: #261f42;
    --vault: #f0c060;
    --vault-soft: #3a2f14;
    --threat: #ff8088;
    --threat-soft: #3d1a1d;
    --cloud: #5fd0de;
    --cloud-soft: #12313a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d;
  --surface: #181e29;
  --surface-2: #212938;
  --text: #e6e9f0;
  --text-sub: #9aa4b8;
  --line: #333d50;
  --accent: #6ea0ff;
  --accent-soft: #1d2c4a;
  --accent-text: #0d1320;
  --ok: #4cc58a;
  --ok-soft: #15301f;
  --ng: #ff7b6e;
  --ng-soft: #3a1c1a;
  --warn: #f0b04f;
  --warn-soft: #382a12;
  --info: #a996ff;
  --info-soft: #261f42;
  --vault: #f0c060;
  --vault-soft: #3a2f14;
  --threat: #ff8088;
  --threat-soft: #3d1a1d;
  --cloud: #5fd0de;
  --cloud-soft: #12313a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 12px); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.85;
  overflow-x: hidden;
}
a { color: var(--accent); }
a:hover { text-decoration-thickness: 2px; }
img, svg { max-width: 100%; }
code, kbd { overflow-wrap: anywhere; font-family: var(--mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
pre { background: var(--surface-2); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: .88em; line-height: 1.6; }
pre code { background: none; padding: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }

/* ---------- Header ---------- */
.site-header {
  position: -webkit-sticky; position: sticky; top: 0; top: env(safe-area-inset-top, 0px); z-index: 50;
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.site-header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-text); display: grid; place-items: center; font-size: 15px; flex: none; }
.site-header .spacer { flex: 1; }
.icon-btn {
  -webkit-appearance: none; appearance: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
  height: 36px; min-width: 36px; padding: 0 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.icon-btn:hover { border-color: var(--accent); }
.menu-btn { display: none; }
.top-links { display: flex; gap: 4px; }
.top-links a { color: var(--text-sub); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
.top-links a:hover, .top-links a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

/* ---------- Layout ---------- */
.layout { display: flex; align-items: flex-start; }
.sidebar {
  position: -webkit-sticky; position: sticky; top: var(--header-h);
  width: var(--sidebar-w); flex: none;
  height: calc(100vh - var(--header-h));
  overflow-y: auto;
  padding: 16px 12px 40px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  font-size: 14px; line-height: 1.5;
}
.sidebar h4 { margin: 18px 8px 6px; font-size: 12px; color: var(--text-sub); letter-spacing: .06em; }
.sidebar a { display: flex; gap: 8px; align-items: baseline; padding: 7px 8px; border-radius: 8px; color: var(--text); text-decoration: none; }
.sidebar a:hover { background: var(--surface-2); }
.sidebar a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.sidebar .num { font-family: var(--mono); font-size: 12px; color: var(--text-sub); min-width: 2.2em; }
.sidebar .done-mark { margin-left: auto; color: var(--ok); font-size: 12px; }
.main { flex: 1; min-width: 0; padding: 28px 16px 80px; }
.content { max-width: 900px; margin: 0 auto; }
.backdrop { display: none; }

@media (max-width: 960px) {
  .menu-btn { display: inline-flex; }
  .top-links { display: none; }
  .sidebar {
    position: fixed; left: 0; top: var(--header-h); z-index: 60;
    transform: translateX(-105%); transition: transform .2s ease;
    box-shadow: var(--shadow);
    width: 86vw; max-width: 320px;
  }
  body.nav-open .sidebar { transform: none; }
  body.nav-open .backdrop { display: block; position: fixed; top: var(--header-h); right: 0; bottom: 0; left: 0; background: rgba(0,0,0,.35); z-index: 55; }
  .main { padding-top: 20px; }
}

/* ---------- Typography ---------- */
h1 { font-size: 1.8rem; font-size: clamp(1.55rem, 4.2vw, 2.1rem); line-height: 1.35; margin: 0 0 12px; }
h2 { font-size: 1.35rem; font-size: clamp(1.25rem, 3.2vw, 1.5rem); line-height: 1.4; margin: 48px 0 14px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
h3 { font-size: 1.12rem; margin: 30px 0 10px; }
h4 { font-size: 1rem; margin: 22px 0 8px; }
p { margin: 0 0 14px; }
ul, ol { padding-left: 1.4em; margin: 0 0 14px; }
li { margin: 4px 0; }
.lead { font-size: 1.06rem; color: var(--text-sub); }
.eyebrow { font-size: 13px; color: var(--accent); font-weight: 700; letter-spacing: .08em; margin-bottom: 4px; }
.muted { color: var(--text-sub); }
.small { font-size: 14px; }
mark, .hl { background: linear-gradient(transparent 55%, var(--warn-soft) 55%); color: inherit; padding: 0 2px; }
strong.key { color: var(--accent); }

/* ---------- Cards / grid ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 14px; grid-template-columns: 1fr; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); margin: 16px 0; }
.grid-2 { display: grid; gap: 14px; grid-template-columns: 1fr; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); margin: 16px 0; }
.card h3, .card h4 { margin-top: 0; }
a.card { color: inherit; text-decoration: none; display: block; transition: border-color .15s, transform .15s; }
a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-sub); border: 1px solid var(--line); margin: 2px 4px 2px 0; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.ng { background: var(--ng-soft); color: var(--ng); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

/* ---------- Callouts ---------- */
.callout { border-radius: var(--radius); padding: 14px 16px 14px 16px; margin: 18px 0; border: 1px solid transparent; border-left-width: 5px; }
.callout > :last-child { margin-bottom: 0; }
.callout .ttl { font-weight: 700; display: block; margin-bottom: 6px; }
.callout.goal { background: var(--accent-soft); border-color: var(--accent); }
.callout.analogy { background: var(--info-soft); border-color: var(--info); }
.callout.key { background: var(--warn-soft); border-color: var(--warn); }
.callout.danger { background: var(--ng-soft); border-color: var(--ng); }
.callout.tip { background: var(--ok-soft); border-color: var(--ok); }
.callout.verify { background: var(--surface-2); border-color: var(--text-sub); font-size: 14px; }
.callout.analogy .ttl::before { content: "たとえ話 ▸ "; color: var(--info); }
.callout.key .ttl::before { content: "★ 重要 ▸ "; color: var(--warn); }
.callout.danger .ttl::before { content: "⚠ 注意 ▸ "; color: var(--ng); }
.callout.tip .ttl::before { content: "現場Tips ▸ "; color: var(--ok); }
.callout.verify .ttl::before { content: "出典・検証メモ ▸ "; }

/* 重点項目：誰が見てもわかる 1 行要約ボックス */
.point-box { display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; background: var(--surface); border: 2px solid var(--warn); border-radius: var(--radius); padding: 16px; margin: 20px 0; }
.point-box .big { font-size: 28px; line-height: 1; }
.point-box p { margin: 0; }
.point-box .one { font-size: 1.08rem; font-weight: 700; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.6; }
th, td { border-bottom: 1px solid var(--line); padding: 9px 12px; text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

/* ---------- Chapter header ---------- */
.ch-hero { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 20px; box-shadow: var(--shadow); margin-bottom: 18px; }
.ch-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.goal-list { list-style: none; padding: 0; margin: 8px 0 0; }
.goal-list li { position: relative; padding-left: 28px; margin: 6px 0; }
.goal-list li::before { content: "✓"; position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--accent-text); font-size: 12px; display: grid; place-items: center; margin-top: 4px; }
.toc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; font-size: 14.5px; }
.toc ol { margin: 6px 0 0; }

/* ---------- Diagrams ---------- */
.diagram-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin: 18px 0; }
.diagram-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.diagram-scroll svg { display: block; width: 100%; min-width: 600px; height: auto; }
.diagram-cap { font-size: 13px; color: var(--text-sub); text-align: center; margin: 6px 0 2px; }
.scroll-hint { display: none; font-size: 12px; color: var(--text-sub); text-align: right; }
@media (max-width: 640px) { .scroll-hint { display: block; } }

svg .dg-zone { fill: none; stroke: var(--line); stroke-dasharray: 6 5; stroke-width: 1.5; }
svg .dg-zone-label { fill: var(--text-sub); font-size: 13px; font-weight: 700; }
svg .dg-node rect { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; transition: all .25s; }
svg .dg-node text { fill: var(--text); font-size: 15px; font-weight: 700; }
svg .dg-node text.sub { font-size: 12px; font-weight: 400; fill: var(--text-sub); }
svg .dg-node.k-vault rect { fill: var(--vault-soft); stroke: var(--vault); }
svg .dg-node.k-user rect { fill: var(--accent-soft); stroke: var(--accent); }
svg .dg-node.k-target rect { fill: var(--ok-soft); stroke: var(--ok); }
svg .dg-node.k-cloud rect { fill: var(--cloud-soft); stroke: var(--cloud); }
svg .dg-node.k-threat rect { fill: var(--threat-soft); stroke: var(--threat); }
svg .dg-node.k-comp rect { fill: var(--info-soft); stroke: var(--info); }
svg .dg-edge path { fill: none; stroke: var(--text-sub); stroke-width: 1.8; marker-end: url(#dg-ah); transition: all .25s; }
svg .dg-edge.dashed path { stroke-dasharray: 6 4; }
svg .dg-edge.both path { marker-start: url(#dg-ah-s); }
svg .dg-edge text { fill: var(--text-sub); font-size: 12.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
svg .dg-badge circle { fill: var(--accent); }
svg .dg-badge text { fill: var(--accent-text); font-size: 12px; font-weight: 700; }

/* Flow (step) mode */
figure.flow { margin: 22px 0; }
.flow svg .dg-node, .flow svg .dg-edge { opacity: .28; }
.flow svg .dg-node.on, .flow svg .dg-edge.on { opacity: 1; }
.flow svg .dg-node.seen, .flow svg .dg-edge.seen { opacity: .6; }
.flow svg .dg-node.on rect { stroke-width: 3; filter: drop-shadow(0 0 6px var(--accent-soft)); }
.flow svg .dg-edge.on path { stroke: var(--accent); stroke-width: 3; marker-end: url(#dg-ah-on); }
.flow svg .dg-edge.on.both path { marker-start: url(#dg-ah-on-s); }
.flow svg .dg-edge.on text { fill: var(--accent); font-weight: 700; }
.flow-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 8px; flex-wrap: wrap; }
.flow-title { font-weight: 700; }
.flow-steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; padding: 0; border: 0; }
.flow-steps legend { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; width: 100%; }
.flow-steps label { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13.5px; cursor: pointer; background: var(--surface-2); line-height: 1.3; }
.flow-steps input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.flow-steps label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.flow-steps input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.flow-desc { list-style: none; padding: 0; margin: 4px 0 0; }
.flow-desc > li { display: none; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; margin: 0; }
.flow-desc > li.on { display: block; animation: fadein .25s ease; }
.flow-desc > li .st { font-weight: 700; color: var(--accent); display: block; margin-bottom: 4px; }
.flow-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 10px; }
@keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------- Self-Hosted / Privilege Cloud 比較 ---------- */
.dual { display: grid; gap: 12px; grid-template-columns: 1fr; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); margin: 16px 0; }
.dual > div { border-radius: var(--radius); padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); }
.dual > div > h4 { margin: 0 0 8px; }
.dual .sh { border-top: 4px solid var(--vault); }
.dual .pc { border-top: 4px solid var(--cloud); }
.dual ul { margin: 0; padding-left: 1.2em; font-size: 15px; }
.dual .src { font-size: 12.5px; color: var(--text-sub); margin: 8px 0 0; }

/* ---------- Checklist ---------- */
ul.checklist { list-style: none; padding: 0; }
ul.checklist li label > span { min-width: 0; }
ul.checklist li label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
ul.checklist li label:hover { background: var(--surface-2); }
ul.checklist input { width: 18px; height: 18px; margin-top: 5px; accent-color: var(--ok); flex: none; }
ul.checklist input:checked + span { color: var(--text-sub); text-decoration: line-through; }
.lab { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 18px 14px; margin: 22px 0; box-shadow: var(--shadow); }
.lab h3 { margin-top: 16px; }

/* ---------- Buttons ---------- */
.btn { -webkit-appearance: none; appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); font: inherit; font-size: 15px; font-weight: 700; padding: 9px 16px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { font-size: 13.5px; padding: 6px 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
td .btn { white-space: nowrap; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }

/* ---------- Review questions (章末・固定順) ---------- */
.review { margin-top: 48px; }
.rq { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 14px 0; }
.rq-q { font-weight: 700; margin-bottom: 10px; }
.rq-opts { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.rq-opts button, .opt-btn { width: 100%; text-align: left; font: inherit; font-size: 15px; line-height: 1.55; color: var(--text); background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; }
.rq-opts button:hover:not(:disabled), .opt-btn:hover:not(:disabled) { border-color: var(--accent); }
.rq-opts button .mk, .opt-btn .mk { font-family: var(--mono); font-weight: 700; color: var(--text-sub); flex: none; }
.rq-opts button.correct, .opt-btn.correct { border-color: var(--ok); background: var(--ok-soft); }
.rq-opts button.wrong, .opt-btn.wrong { border-color: var(--ng); background: var(--ng-soft); }
.rq-opts button:disabled, .opt-btn:disabled { cursor: default; }
.rq-exp { display: none; margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 15px; }
.rq.answered .rq-exp { display: block; }
.rq-result { font-weight: 700; margin-right: 6px; }
.rq-result.ok { color: var(--ok); }
.rq-result.ng { color: var(--ng); }

/* ---------- Chapter footer nav ---------- */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; }
.pager a { display: block; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--text); }
.pager a:hover { border-color: var(--accent); }
.pager .dir { font-size: 12px; color: var(--text-sub); display: block; }
.pager .next { text-align: right; grid-column: 2; }
.complete-box { margin-top: 30px; text-align: center; padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---------- Glossary ---------- */
.gl-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 18px; position: -webkit-sticky; position: sticky; top: var(--header-h); background: var(--bg); padding: 10px 0; z-index: 5; }
.gl-tools input[type="search"] { flex: 1 1 240px; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); min-width: 0; }
.gl-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.gl-filter button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
.gl-filter button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
dl.gl { margin: 0; }
.gl-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
.gl-item dt { font-weight: 700; font-size: 1.05rem; }

<!-- ===================== B1 ===================== -->
<details class="case" data-case="B1" id="case-B1" open>
<summary><span class="chip ok">基本</span><h3>B1. 新規Linuxサーバの登録依頼</h3><span class="chip">関連：6・7・8章</span></summary>
<div class="case-body">
<h4>状況</h4>
<p>インフラ課から「本番Webサーバ <code>hk-web03</code>（10.30.1.13、RHEL）を構築したので、rootをCyberArkの管理下に入れてほしい」と依頼が来ました。先輩の山本さんから、高橋さんが担当するよう指示されました。</p>
<ul class="small">
<li><code>hk-web03</code> は <code>PermitRootLogin no</code>（rootで直接SSH不可）。管理者は一般ユーザー <code>opsadmin</code> でログインして <code>sudo</code>/<code>su</code> する運用</li>
<li>インフラ課の運用担当（ADグループ <code>GG_PAM_INF_USERS</code>）は、PSM経由でrootを使いたい。パスワードを見る必要はない</li>
<li>既存のSafe：<code>HK-PRD-INF-LNX-ROOT</code>（本番Linux root）、<code>HK-STG-INF-LNX-ROOT</code>（検証Linux root）、<code>HK-PRD-DBA-ORA-SYS</code>（本番Oracle）</li>
<li>構築時のrootパスワードは、構築ベンダーと構築担当3名が知っている</li>
</ul>

<div class="cq" data-type="single" data-pts="10" data-correct="0">
<div class="cq-h">Q1. rootアカウントを格納するSafeとして適切なのは？</div>
<ul class="cq-opts"><li>HK-PRD-INF-LNX-ROOT</li><li>HK-STG-INF-LNX-ROOT</li><li>HK-PRD-DBA-ORA-SYS</li><li>サーバ専用のSafe「HK-WEB03」を新規作成</li></ul>
<div class="feedback">本番・インフラ課・Linux rootという「使う人と使い方」が既存Safeと一致するため、HK-PRD-INF-LNX-ROOTに格納します。サーバ1台ごとのSafeは管理不能になるため避けます（第6章）。</div>
</div>

<div class="cq" data-type="multi" data-pts="20" data-correct="0,1">
<div class="cq-h">Q2. <code>GG_PAM_INF_USERS</code> に付与すべきSafe権限をすべて選んでください。</div>
<ul class="cq-opts"><li>List accounts</li><li>Use accounts</li><li>Retrieve accounts</li><li>Manage Safe members</li><li>Delete accounts</li></ul>
<div class="feedback">PSM経由で使うだけなので「List＋Use」で十分です。Retrieveはパスワードが見えてしまい、Manage Safe membersやDeleteは利用者に不要な管理権限です（第6章）。</div>
</div>

<div class="cq" data-type="single" data-pts="10" data-correct="2">
<div class="cq-h">Q3. CPMがrootのパスワードを変更できるようにするために必要な設定は？</div>
<ul class="cq-opts"><li>rootの直接SSHを許可するようインフラ課に依頼する</li><li>Masterユーザーを関連付ける</li><li>opsadminをLogon Accountとして関連付ける</li><li>Retrieve権限をCPMに付与する</li></ul>
<div class="feedback">rootの直接SSHが禁止されている場合は、Logon Account（opsadmin）でログインしてから切り替えて変更します。セキュリティ設定を緩める必要はありません（第7章）。</div>
</div>

<div class="cq" data-type="order" data-pts="20">
<div class="cq-h">Q4. 登録作業を正しい順に並べてください。</div>
<ol class="cq-order">
<li>依頼内容（対象・利用者・依存先の有無）を確認する</li>
<li>opsadminをLogon Accountとして先に登録する</li>
<li>rootをプラットフォーム・Safeを指定して登録し、Logon Accountを関連付ける</li>
<li>CPMで検証（Verify）し、接続情報が正しいことを確認する</li>
<li>CPMでパスワードを変更（Change）する</li>
<li>依頼者へ完了連絡し、PSM経由での接続確認をしてもらう</li>
</ol>
<div class="feedback">確認→関連アカウント登録→対象登録→検証→変更→完了連絡の順です。検証で接続情報の誤りを潰してから変更します（第7・8章）。</div>
</div>

<div class="cq" data-type="essay" data-pts="40">
<div class="cq-h">Q5.（記述）登録直後にパスワードを変更すべき理由と、変更前に関係者へ伝えるべきことを書いてください。</div>
<ul class="rubric">
<li data-pts="10">構築ベンダー・構築担当など、現在のパスワードを知っている人がいるため、変更しないと統制が効かないことに触れている</li>
<li data-pts="10">変更後はCyberArk（PSM）経由でしか使えなくなることを関係者に周知する、と書いている</li>
<li data-pts="10">rootのパスワードを使っている依存先（スクリプト・ジョブ等）がないか事前に確認する、と書いている</li>
<li data-pts="10">変更日時・問い合わせ先・切り戻し（トラブル時の連絡）方法などを伝える、と書いている</li>
</ul>
<div class="feedback">
<p><strong>模範解答例：</strong>現在のrootパスワードは構築ベンダーと構築担当3名が知っており、登録しただけでは「CyberArkを通さず使える人」が残るため、登録直後にCPMで変更して旧パスワードを無効化する。変更前に、インフラ課と構築ベンダーへ「変更日時」「以降はPVWA/PSM経由で利用すること」「rootのパスワードを使うスクリプトやジョブがあれば事前に申し出ること」「トラブル時の連絡先」を周知する。</p>
</div>
</div>
</div>
</details>

<!-- ===================== B2 ===================== -->
<details class="case" data-case="B2" id="case-B2">
<summary><span class="chip ok">基本</span><h3>B2. 月曜朝のCPM検証エラー</h3><span class="chip">関連：7・8・12章</span></summary>
<div class="case-body">
<h4>状況</h4>
<p>月曜の朝、日次チェックで次のエラーを見つけました。</p>
<div class="table-wrap"><table>
<thead><tr><th>アカウント</th><th>アドレス</th><th>状態</th><th>最終エラー</th></tr></thead>
<tbody><tr><td>Administrator</td><td>hk-fs01（10.30.3.31）</td><td>Verify失敗（土曜 02:00〜 連続）</td><td>認証失敗（ユーザー名またはパスワードが正しくない）</td></tr></tbody>
</table></div>
<ul class="small">
<li>同じCPMが管理する他のWindowsサーバ（約200台）は正常</li>
<li>金曜夜に保守ベンダーが <code>hk-fs01</code> のOS再構築（バックアップからの復元）を実施したと、変更管理の記録にある</li>
<li>プラットフォームでは「不一致時の自動調整」は無効。Reconcile Accountは関連付け済み</li>
</ul>
<script class="dg" type="application/json">
{"w":760,"h":200,"caption":"図：B2の関係図",
"nodes":[
{"id":"cpm","x":20,"y":120,"w":150,"h":60,"label":"CPM","sub":"hk-cpm01","kind":"comp"},
{"id":"v","x":300,"y":10,"w":160,"h":60,"label":"Vault","sub":"金曜時点のPW","kind":"vault"},
{"id":"t","x":590,"y":120,"w":150,"h":60,"label":"hk-fs01","sub":"復元＝古いPW?","kind":"target"}],
"edges":[{"from":"cpm","to":"t","label":"Verify → 認証失敗"},{"from":"v","to":"cpm","label":"PW取得"}]}
</script>

<div class="cq" data-type="single" data-pts="15" data-correct="1">
<div class="cq-h">Q1. 最も可能性の高い原因は？</div>
<ul class="cq-opts"><li>CPMとVault間のTCP 1858がFWで遮断された</li><li>バックアップから復元したことで、ターゲット側のパスワードが復元時点の古い値に戻り、Vaultの値と不一致になった</li><li>Safe名が命名規則に違反している</li><li>PSMの録画容量が不足している</li></ul>
<div class="feedback">他の200台が正常なのでCPMやVault通信の問題ではありません。「認証失敗」かつ直前にバックアップ復元があることから、パスワードの不一致が最有力です（第8章）。</div>
</div>

<div class="cq" data-type="multi" data-pts="25" data-correct="0,2,3">
<div class="cq-h">Q2. 適切な対応をすべて選んでください。</div>
<ul class="cq-opts"><li>ターゲット側でAdministratorがロックされていないか確認する</li><li>検証間隔を1分に短縮して自動で直るのを待つ</li><li>Reconcile（調整）を手動で実行して同期を回復する</li><li>復元作業の手順に「CyberArk管理アカウントの調整」を追加するよう、変更管理プロセスへフィードバックする</li><li>Administratorを一旦CyberArkから削除して登録し直す</li></ul>
<div class="feedback">ロック確認→手動Reconcile→再発防止のプロセス改善が正しい流れです。検証の連打はロックアウトを招き、削除・再登録は履歴が途切れるため不要です（第8章）。</div>
</div>

<div class="cq" data-type="order" data-pts="20">
<div class="cq-h">Q3. 対応の順序を並べてください。</div>
<ol class="cq-order">
<li>影響範囲を確認する（エラーは hk-fs01 の1件のみか）</li>
<li>変更管理記録とエラー内容から原因の仮説を立てる</li>
<li>ターゲットのロック状態を確認する</li>
<li>手動でReconcileを実行する</li>
<li>Verifyで同期回復を確認する</li>
<li>報告と再発防止策の提案を行う</li>
</ol>
<div class="feedback">範囲確認→仮説→安全確認（ロック）→対処→確認→報告・再発防止、が障害対応の型です（第15章）。</div>
</div>

<div class="cq" data-type="essay" data-pts="40">
<div class="cq-h">Q4.（記述）上長（山本さん）への報告文を書いてください。事象・原因・対応・再発防止を含めてください。</div>
<ul class="rubric">
<li data-pts="10">事象（いつから・どのアカウントで・何のエラーか・影響範囲が1台であること）を書いている</li>
<li data-pts="10">原因（バックアップ復元によりパスワードが古い値に戻り不一致）を根拠とともに書いている</li>
<li data-pts="10">対応（ロック確認、Reconcile実行、Verifyでの確認結果）を書いている</li>
<li data-pts="10">再発防止（復元・再構築手順へのCyberArk調整手順の追加、または自動調整の有効化の検討）を書いている</li>
</ul>
<div class="feedback">
<p><strong>模範解答例：</strong>【事象】土曜02:00以降、hk-fs01のAdministratorでCPMの検証が認証失敗。他の約200台は正常で影響は1台のみ。【原因】金曜夜の保守ベンダーによるOS再構築でバックアップから復元され、パスワードが復元時点の古い値に戻ったため、Vaultの値と不一致になったと判断。【対応】ロックされていないことを確認のうえ手動でReconcileを実行し、Verifyが成功したことを確認済み。【再発防止】サーバの復元・再構築手順に「CyberArk管理アカウントのReconcile実施」を追加するよう変更管理へ提案。あわせて、このプラットフォームで不一致時の自動調整を有効化するかを検討したい。</p>
</div>
</div>
</div>
</details>

<!-- ===================== B3 ===================== -->
<details class="case" data-case="B3" id="case-B3">
<summary><span class="chip ok">基本</span><h3>B3. 保守委託先によるOracle作業</h3><span class="chip">関連：6・9・10章</span></summary>
<div class="case-body">
<h4>状況</h4>
<p>保守委託先「ネクスト保守サービス（架空）」の小林さんが、来週の土曜 22:00〜24:00 に本番DB <code>hk-db01</code> のパッチ適用を行います。情報セキュリティ部の森課長から次の要件が示されました。</p>
<ul class="small">
<li>作業ごとにDB課長の承認を得ること</li>
<li>委託先にパスワードを知らせないこと</li>
<li>作業内容を後から確認できるようにすること</li>
<li>作業時間帯以外は使えないようにすること</li>
<li>作業後、SYSTEMアカウントのパスワードが漏れていても使えない状態にすること</li>
</ul>

<div class="cq" data-type="multi" data-pts="25" data-correct="0,1,3,4">
<div class="cq-h">Q1. 要件を満たすために有効化すべきルール・機能をすべて選んでください。</div>
<ul class="cq-opts"><li>二重承認（Dual Control）＋利用時間帯の指定</li><li>PSM経由の接続と録画</li><li>委託先へのRetrieve権限付与</li><li>理由の入力必須（作業チケット番号）</li><li>作業後のパスワード変更（ワンタイム、またはCPMによる即時変更）</li></ul>
<div class="feedback">承認・時間帯、PSM録画、理由入力、作業後の変更が要件に対応します。Retrieveは「パスワードを知らせない」に反します（第9・10章）。</div>
</div>

<div class="cq" data-type="single" data-pts="15" data-correct="3">
<div class="cq-h">Q2. 委託先用ADグループ（<code>GG_PAM_VND_NEXT</code>）に付与するSafe権限として最も適切なのは？</div>

</div>

<details class="case" data-case="B4" id="case-B4">
<summary><span class="chip ok">基本</span><h3>B4. Privilege Cloud：週明けにコネクタが切断</h3><span class="chip">関連：5・8・10・15章</span></summary>
<div class="case-body">
<h4>状況</h4>
<p>ヒカリ精機の工場部門は Privilege Cloud を利用しています（推奨構成：コネクタ <code>hk-conn01</code>／<code>hk-conn02</code> に Connector Management エージェント＋PSM、パスワード変更は Secrets Rotation Service）。月曜の朝、次の状態になっていました。</p>
<ul class="small">
<li>Connector Management の画面で、2台のコネクタが両方とも「切断」表示</li>
<li>PSM経由の接続が全員失敗。パスワードの変更・検証も週末から全件失敗</li>
<li>Privilege Cloud ポータルへのログイン（Identity）は正常</li>
<li>変更管理の記録：土曜にネットワーク部門が「インターネット向け通信を新しいプロキシに集約し、許可はHTTPS（443）のみに統一」する作業を実施。新プロキシは別の公開IPアドレスから外へ出る</li>
</ul>

<div class="cq" data-type="single" data-pts="15" data-correct="2">
<div class="cq-h">Q1. 最も可能性の高い原因は？</div>
<ul class="cq-opts"><li>Identityの障害でログインできないため</li><li>SaaS側のVaultが故障したため</li><li>プロキシ変更により、コネクタからの TCP 1858 の外向き通信が遮断された／送信元の公開IPが変わり、SaaS側の許可リストと一致しなくなった</li><li>Master Policyの変更間隔が短すぎるため</li></ul>
<div class="feedback">ポータルへのログインは正常で、コネクタだけが切れています。公式要件ではコネクタは443に加えてTCP 1858の外向き通信が必要で、SaaS側は届け出た送信元IPからの通信だけを許可します。「443のみ」「公開IPの変更」の両方が当てはまります（第5章）。</div>
</div>

<div class="cq" data-type="multi" data-pts="25" data-correct="0,1,3">
<div class="cq-h">Q2. 切り分け・対応として適切なものをすべて選んでください。</div>
<ul class="cq-opts"><li>コネクタからVaultバックエンドの1858番ポートへの疎通を確認する（例：<code>Test-NetConnection &lt;宛先&gt; -Port 1858</code>）</li><li>新しい送信元の公開IPアドレスを確認し、テクニカルサポートへ許可リストの更新を依頼する</li><li>インターネットからコネクタへのインバウンド3389を開放する</li><li>ネットワーク部門と、宛先を限定した1858番の外向き許可（またはプロキシの経路設定）を合意する</li><li>コネクタを削除してSafeを作り直す</li></ul>
<div class="feedback">外向き1858の疎通確認、送信元IPの届け出、ネットワーク部門との許可設定が正しい対応です。インバウンド開放は不要かつ危険で、Safeの作り直しは無関係です。</div>
</div>

<div class="cq" data-type="order" data-pts="20">
<div class="cq-h">Q3. 対応の順序を並べてください。</div>
<ol class="cq-order">
<li>影響範囲を確認する（全コネクタ・全機能か、ポータルは正常か）</li>
<li>変更管理の記録から直前の変更（プロキシ集約）を特定する</li>
<li>コネクタからの外向き通信（443・1858）と送信元IPを確認する</li>
<li>ネットワーク部門に許可設定を、テクニカルサポートに送信元IPの更新を依頼する</li>
<li>Connector Managementで接続回復を確認し、PSM接続とパスワード検証を試す</li>
<li>報告し、ネットワーク変更時のチェック項目にCyberArkの通信要件を加える</li>
</ol>
<div class="feedback">範囲確認→直前の変更→仮説の検証→関係者への依頼→回復確認→再発防止、の型です（第15章）。</div>
</div>

<div class="cq" data-type="essay" data-pts="40">
<div class="cq-h">Q4.（記述）再発防止策を、ネットワーク部門・PAMチーム双方の観点で書いてください。</div>
<ul class="rubric">
<li data-pts="10">ネットワーク変更の事前レビューに、CyberArkコネクタの通信要件（443・1858、TLS 1.2以上、宛先）をチェック項目として登録する</li>
<li data-pts="10">送信元の公開IPを変える変更は、事前にテクニカルサポートへ届け出る手順にする</li>
<li data-pts="10">Connector Managementのコネクタ状態や、パスワード変更・検証の失敗を監視し、早期に通知されるようにする</li>
<li data-pts="10">コネクタの冗長化を、同じ経路に依存しない形で検討する（2台が同じプロキシ経由だと同時に止まる）</li>
</ul>
<div class="feedback">
<p><strong>模範解答例：</strong>ネットワーク部門の変更レビューに「Privilege Cloudコネクタの外向き要件（443・1858、TLS 1.2以上、宛先）」と「送信元公開IPの変更時はテクニカルサポートへ事前届け出」を追加する。PAMチームは、Connector Managementのコネクタ状態とパスワード変更・検証の失敗を監視して即時に通知されるようにする。また、2台のコネクタが同じプロキシ経路に依存していたため、経路の冗長化も検討する。</p>
</div>
</div>
</div>
</details>

<li data-pts="10">サービス用アカウントを人が対話ログオンに使えない設計（ログオン制限・用途分離）に触れている</li>
<li data-pts="10">PTAの自動対応（自動ローテーション・セッション停止）の有効化を挙げている</li>
<li data-pts="10">EPM等で端末のローカル管理者権限を除去し、資格情報窃取対策を行うことを挙げている</li>

<details class="case" data-case="A2" id="case-A2">
<summary><span class="chip warn">応用</span><h3>A2. Self-HostedからPrivilege Cloudへの移行設計</h3><span class="chip">関連：4・5・11・15章</span></summary>
<div class="case-body">
<h4>状況</h4>
<p>ヒカリ精機は、サポート期限とインフラ運用負荷を理由に、現行のPAM Self-HostedからPrivilege Cloudへの移行を検討しています。</p>
<div class="table-wrap"><table>
<thead><tr><th>項目</th><th>現状・要件</th></tr></thead>
<tbody>
<tr><td>拠点</td><td>本社DC（10.10.0.0/16）と工場DC（10.50.0.0/16）。工場から本社への回線は細い</td></tr>
<tr><td>管理対象</td><td>約3,000アカウント（Windows・Linux・Oracle・NW機器）</td></tr>
<tr><td>認証</td><td>現行はLDAP（オンプレAD）＋RADIUS MFA。全社では Entra ID によるSSOを推進中</td></tr>
<tr><td>監査要件</td><td>セッション録画を1年間参照可能にすること</td></tr>
<tr><td>ネットワーク</td><td>インターネットへのアウトバウンドHTTPS（443）はプロキシ経由で許可可能。それ以外のポートの外向き通信は現在すべて禁止。インバウンドは不可</td></tr>
</tbody></table></div>

<div class="cq" data-type="multi" data-pts="20" data-correct="0,1,4">
<div class="cq-h">Q1. 移行後もヒカリ精機側（オンプレ）に配置・運用するものをすべて選んでください。</div>
<ul class="cq-opts"><li>CPM・PSMを載せたコネクタサーバ</li><li>Linux向けのPSM for SSH（SSHセッションを中継する場合）</li><li>Digital Vault</li><li>Vault の DR サーバ</li><li>Secure Tunnel・Identity Connector 等のオンプレ連携コンポーネント（必要に応じて）</li></ul>
<div class="feedback">VaultとそのDRはCyberArkが運用します。顧客側にはコネクタ（CPM・PSM）、必要に応じてPSM for SSHやオンプレ連携のコンポーネントを置きます（第5章）。</div>
</div>

<div class="cq" data-type="single" data-pts="15" data-correct="1">
<div class="cq-h">Q2. 工場DCのターゲットへの対応として最も適切な設計は？</div>
<ul class="cq-opts"><li>本社のコネクタから細い回線越しにすべて管理する</li><li>工場DCにもコネクタ（CPM・PSM）を配置し、工場のSafeの担当にする</li><li>工場のターゲットは管理対象から外す</li><li>工場のFWでインバウンドを開放し、SaaSから直接接続させる</li></ul>
<div class="feedback">ターゲットに近い場所にコネクタを置くのが基本です。インバウンド開放は不要かつ不適切です（第5・8章）。</div>
</div>

<div class="cq" data-type="order" data-pts="20">
<div class="cq-h">Q3. 移行プロジェクトの進め方を並べてください。</div>
<ol class="cq-order">
<li>現行環境の棚卸し（Safe・プラットフォーム・カスタム設定・連携・録画量）</li>
<li>移行後の設計（認証方式、コネクタ配置、ネットワーク要件の確認）</li>
<li>Privilege Cloud環境とコネクタの構築、認証連携の設定</li>
<li>パイロット移行（一部のSafe・利用者で検証）</li>
<li>本移行（ウェーブ単位）と利用者の切替・周知</li>
<li>旧環境の停止計画（録画データ参照の扱いを含む）</li>
</ol>
<div class="feedback">棚卸し→設計→構築→パイロット→本移行→旧環境停止の順で、並行稼働期間とロールバック計画を設けます。</div>
</div>

<div class="cq" data-type="essay" data-pts="45">
<div class="cq-h">Q4.（記述）移行の主なリスクと、その対策を3つ以上挙げてください。</div>
<ul class="rubric">
<li data-pts="9">認証方式の変更（LDAP＋RADIUS → Identity／Entra ID連携）に伴う利用者の混乱やMFA要件の確認、緊急用ログイン経路の設計に触れている</li>
<li data-pts="9">カスタムプラットフォーム・プラグイン・連携（チケット連携、CP/CCP、API連携）の互換性確認に触れている</li>
<li data-pts="9">旧環境の録画データ（1年参照要件）の扱い（旧環境の参照期間の確保・保管方法）に触れている</li>
<li data-pts="9">コネクタには443だけでなくTCP 1858の外向き通信が必要なこと（現状ポリシーでは不足）、プロキシ・TLS検査の扱い、送信元公開IPの届け出に触れている</li>
<li data-pts="9">並行稼働期間中にCPMが新旧両方から同じアカウントを変更しないよう、管理の切替タイミングを制御することに触れている</li>
</ul>
<div class="feedback">
<p><strong>模範解答例：</strong>①認証の変更：Entra IDとのSAML連携に切り替えるため、パイロットでMFAと権限マッピングを検証し、IdP障害時の緊急ログイン経路を用意する。②互換性：カスタムプラットフォームや連携（CCP利用アプリ、ITSM連携、APIスクリプト）を棚卸しし、移行先での対応を事前検証する。③録画：旧環境の録画は1年参照要件を満たすまで参照手段を残す（旧環境の縮退運用や保管方法を決める）。④通信：コネクタは443に加えてTCP 1858の外向き通信が必要だが、現行ポリシーは443以外を禁止しているため、ネットワーク部門と例外（宛先を限定した1858許可）を事前に合意する。あわせてプロキシ・TLS検査の扱いを確認し、送信元の公開IPを固定してテクニカルサポートへ届け出る。⑤二重管理：並行稼働中に新旧のCPMが同じアカウントを変更しないよう、ウェーブ単位で旧環境側の自動管理を停止してから新環境で有効化する。</p>
</div>
</div>
</div>
</details>

<details class="case" data-case="A3" id="case-A3">
<summary><span class="chip warn">応用</span><h3>A3. アプリのパスワード直書きをなくす</h3><span class="chip">関連：6・8・13章</span></summary>
<div class="case-body">
<h4>状況</h4>
<p>内部監査で「アプリの設定ファイルにDBパスワードが平文で書かれている」と指摘されました。開発チームの中村さんと一緒に、対応方針を決めます。</p>
<div class="table-wrap"><table>
<thead><tr><th>システム</th><th>特徴</th></tr></thead>
<tbody>
<tr><td>販売アプリ（hk-app01）</td><td>オンプレのJavaアプリ。サーバにエージェント導入可。DB停止時もアプリは極力止めたくない</td></tr>
<tr><td>生産管理パッケージ（hk-mes01）</td><td>ベンダー製アプライアンス。OSに手を入れられない。HTTPSでの外部取得機能あり</td></tr>
<tr><td>新受注サービス</td><td>AWS上のKubernetes（EKS）で動くマイクロサービス群。CI/CDで頻繁にデプロイ</td></tr>
<tr><td>請求バッチ（AWS Lambda）</td><td>AWS Secrets Managerから読む実装済み。コード改修は避けたい</td></tr>
</tbody></table></div>

<div class="cq" data-type="match" data-pts="20" data-options="CP（Credential Provider）|CCP（Central Credential Provider）|Secrets Manager|Secrets Hub">
<div class="cq-h">Q1. 各システムに最も適した方式を選んでください。</div>
<ul class="cq-match">
<li data-answer="0">販売アプリ（hk-app01）</li>
<li data-answer="1">生産管理パッケージ（hk-mes01）</li>
<li data-answer="2">新受注サービス（EKS）</li>
<li data-answer="3">請求バッチ（Lambda＋AWS Secrets Manager）</li>
</ul>
<div class="feedback">エージェント可＋高可用→CP、エージェント不可→CCP、Kubernetes→Secrets Manager、クラウド標準ストアをそのまま使う→Secrets Hub（第13章）。</div>
</div>

<div class="cq" data-type="multi" data-pts="20" data-correct="0,1,3">
<div class="cq-h">Q2. 販売アプリ用Safe（HK-PRD-APP-ORA-APPUSR）の設計として適切なものをすべて選んでください。</div>
<ul class="cq-opts"><li>アプリのApplication IDにList・Retrieveを付与する</li><li>Credential Providerのユーザーに、取得に必要な権限（Retrieve・List・View Safe members等）を付与する</li><li>開発者全員にRetrieveを付与し、障害時に見られるようにする</li><li>Application IDの認証条件に、許可マシン（10.30.1.21）やOSユーザー等を設定する</li><li>アプリが確実に取得できるよう、アプリ認証の条件は設定しない</li></ul>
<div class="feedback">アプリとProviderに必要最小限の権限を付け、アプリ認証条件で「本物のアプリ」だけが取得できるようにします。人にはRetrieveを付けません（第13章）。</div>
</div>

<div class="cq" data-type="single" data-pts="10" data-correct="0">
<div class="cq-h">Q3. EKS上のサービスが「シークレット・ゼロ問題」を回避して認証する方法として適切なのは？</div>
<ul class="cq-opts"><li>Kubernetesのサービスアカウント等、プラットフォームが発行するIDで認証する</li><li>APIキーをコンテナイメージに埋め込む</li><li>環境変数にVaultの管理者パスワードを設定する</li><li>ConfigMapに平文で保存する</li></ul>
<div class="feedback">ワークロードのIDで認証することで、最初の秘密を埋め込まずに済みます（第13章）。</div>
</div>

<div class="cq" data-type="essay" data-pts="50">
<div class="cq-h">Q4.（記述）販売アプリをCP方式へ切り替え、appuserのパスワードをCPMで定期変更するまでの導入計画を、業務停止を避ける観点で書いてください。</div>
<ul class="rubric">
<li data-pts="10">検証環境での事前検証（取得処理・エラー処理・性能）に触れている</li>
<li data-pts="10">アプリ側の改修（設定ファイルからの削除、取得処理の実装、取得失敗時のリトライ・キャッシュの扱い）に触れている</li>
<li data-pts="10">パスワード変更時の接続プール・既存セッションへの影響（再取得のタイミング、変更時間帯の制限）に触れている</li>
<li data-pts="10">切替後に旧パスワードを変更し、設定ファイルやGit履歴に残った値を無効化することに触れている</li>
<li data-pts="10">監視（取得失敗・CPMエラー）と、問題発生時の切り戻し手順・連絡体制に触れている</li>
</ul>
<div class="feedback">
<p><strong>模範解答例：</strong>①検証環境にCPを導入し、アプリの取得処理（起動時・接続エラー時の再取得、取得失敗時のリトライ）を実装して性能と障害時動作を確認する。②本番ではApplication IDと認証条件、Safe権限を設定し、設定ファイルからパスワードを削除したリリースを業務影響の少ない時間帯に適用する。③切替完了後、CPMでappuserのパスワードを変更し、設定ファイルやGit履歴に残っていた旧パスワードを無効化する。④定期変更は業務時間外に限定し、接続プールが新パスワードを再取得できることを確認する。⑤取得失敗やCPMエラーを監視し、問題時の切り戻し手順と開発・運用の連絡体制を事前に決めておく。</p>
</div>
</div>
</div>
</details>

<div class="ch-hero">
  <div class="eyebrow">CHAPTER 01｜基礎</div>
  <h1>特権IDとPAMの基礎</h1>
  <p class="lead">CyberArkを学ぶ前に、「何を、なぜ守るのか」をはっきりさせます。ここが腹落ちすると、以降の機能がすべて「理由のある仕組み」に見えてきます。</p>
  <h4>この章の全体像</h4>
  <p class="small">特権IDの定義 → 狙われる理由（攻撃の流れ）→ よくある管理不備 → PAMの4つの柱 → CyberArkの位置づけ</p>
  <h4>この章のゴール</h4>
  <ul class="goal-list">
    <li>特権IDの具体例を5つ以上挙げられる</li>
    <li>攻撃者が特権IDを狙う理由を「侵入→横展開→目的達成」の流れで説明できる</li>
    <li>PAMの4つの柱（保管・制御・監視・自動化）を説明できる</li>
  </ul>
  <div class="ch-meta"><span class="chip acc">目安 60分</span><span class="chip">前提知識：なし</span></div>
</div>

<div class="toc"><strong>目次</strong><ol><li><a href="#s1">特権IDとは</a></li><li><a href="#s2">なぜ狙われるのか</a></li><li><a href="#s3">よくある管理不備</a></li><li><a href="#s4">PAMの4つの柱</a></li><li><a href="#s5">CyberArkの立ち位置</a></li><li><a href="#review">振り返り問題</a></li></ol></div>

<h2 id="s1">1. 特権IDとは</h2>
<p><strong>特権ID（特権アカウント）</strong>とは、システムの設定変更、全データの閲覧・削除、他ユーザーの作成など、<mark>通常ユーザーにはできない強い操作ができるアカウント</mark>のことです。</p>

<div class="callout analogy"><span class="ttl">ビルの「マスターキー」</span>
<p>オフィスビルでは、社員は自分のフロアの鍵しか持ちません。しかし管理会社は<strong>全フロア・全部屋を開けられるマスターキー</strong>を持っています。マスターキーが盗まれたら、ビル中のどこにでも入られてしまいます。特権IDはITシステムにおけるマスターキーです。</p>
</div>

<div class="table-wrap"><table>
<thead><tr><th>分類</th><th>具体例</th><th>使う人／もの</th></tr></thead>
<tbody>
<tr><td>OSの管理者</td><td>Linuxの <code>root</code>、Windowsのローカル <code>Administrator</code></td><td>サーバ管理者</td></tr>
<tr><td>ディレクトリ管理者</td><td>Active Directoryの Domain Admins メンバー</td><td>AD管理者</td></tr>
<tr><td>データベース管理者</td><td>Oracleの <code>SYS</code> / <code>SYSTEM</code>、SQL Serverの <code>sa</code></td><td>DBA</td></tr>
<tr><td>ネットワーク機器</td><td>ルータ・スイッチ・ファイアウォールの管理者（enable等）</td><td>ネットワーク担当</td></tr>
<tr><td>クラウド</td><td>AWSのルートユーザー、Azureのグローバル管理者、IAMの管理者ロール</td><td>クラウド担当</td></tr>
<tr><td>アプリケーション</td><td>アプリがDBに接続するためのサービスアカウント、APIキー、SSH鍵</td><td><strong>人ではなくプログラム</strong></td></tr>
<tr><td>SaaS管理者</td><td>業務SaaSの管理者アカウント</td><td>SaaS管理者</td></tr>
</tbody></table></div>

<div class="callout key"><span class="ttl">「人」だけでなく「機械」も特権IDを持つ</span>
<p>アプリケーションやスクリプト、CI/CDパイプラインが使うパスワード・キー（<strong>シークレット</strong>）も特権IDです。近年は人より機械のIDの方が圧倒的に多いと言われ、CyberArkも第13章で学ぶ「シークレット管理」に力を入れています。</p>
</div>

<h2 id="s2">2. なぜ特権IDが狙われるのか</h2>
<p>多くのサイバー攻撃は「最初に侵入した端末」だけでは目的（情報窃取・ランサムウェア展開）を達成できません。攻撃者は<strong>特権IDを手に入れて権限を広げ</strong>、目的のサーバへ移動します。下の図でSTEPを切り替えて流れを追ってください。</p>

<figure class="flow">
<div class="flow-head"><span class="flow-title">図1-1：特権IDを狙った典型的な攻撃の流れ</span></div>

<ol class="flow-desc">
<li data-label="侵入">攻撃者はフィッシングメールなどで、まず<strong>一般社員のPC</strong>に入り込みます。この時点では一般ユーザーの権限しかありません。</li>

<li data-label="横展開">盗んだ管理者パスワードが<strong>他のサーバでも同じ</strong>（使い回し・何年も変更なし）なら、次々と別サーバへ移動できます。これを<strong>ラテラルムーブメント（横展開）</strong>と呼びます。</li>
<li data-label="権限昇格">移動先でさらに強い特権ID（ドメイン管理者など）を見つけ、最終的に組織全体を支配できる権限を得ます。</li>
<li data-label="目的達成">基幹データを盗み出したり、全サーバにランサムウェアを配布したりします。<strong>特権IDさえ守られていれば、②〜④のどこかで攻撃を止められた</strong>可能性が高いのです。</li>

<h2 id="s3">3. よくある特権IDの管理不備</h2>
<div class="grid-2">
<div class="card"><h4>😱 共有と使い回し</h4><p class="small">「rootのパスワードはみんな知っている」「全サーバのAdministratorが同じ」。誰が使ったか追えず、1台漏れれば全滅します。</p></div>
<div class="card"><h4>📝 Excel・付箋管理</h4><p class="small">パスワード一覧表がファイルサーバに置かれている。ファイル1つ盗まれるだけで終わりです。</p></div>
<div class="card"><h4>⏳ 何年も変更しない</h4><p class="small">退職者や委託先が昔のパスワードを知ったままになり、いつでもログインできてしまいます。</p></div>
<div class="card"><h4>👀 操作の記録がない</h4><p class="small">障害や情報漏えいが起きても「誰が何をしたか」がわからず、原因究明も再発防止もできません。</p></div>
<div class="card"><h4>💻 コードに埋め込み</h4><p class="small">アプリの設定ファイルやスクリプトにDBパスワードが平文で書かれ、Git等で拡散します。</p></div>
<div class="card"><h4>♾ 常に強い権限</h4><p class="small">必要なときだけでなく、いつでも特権を持っている状態（常設特権）は、盗まれたときの被害が最大化します。</p></div>
</div>

<h2 id="s4">4. PAMの4つの柱</h2>
<p>PAM（Privileged Access Management：特権アクセス管理）は、上の不備をまとめて解決する考え方です。本教材では次の4本の柱で整理します。</p>
<div class="table-wrap"><table>
<thead><tr><th>柱</th><th>何をするか</th><th>CyberArkの主な機能（後の章）</th></tr></thead>
<tbody>
<tr><td><strong>① 保管（Vault）</strong></td><td>特権の資格情報を1か所の堅牢な金庫に集め、暗号化して保管する</td><td>Digital Vault、Safe（第4・6章）</td></tr>
<tr><td><strong>② 制御（Control）</strong></td><td>誰が・いつ・どのアカウントを使えるかを権限と承認で制御する</td><td>Safe権限、Master Policy、二重承認（第6・9章）</td></tr>
<tr><td><strong>③ 監視（Monitor）</strong></td><td>使った操作を記録・録画し、危険な振る舞いを検知する</td><td>PSM、監査ログ、PTA（第10・12章）</td></tr>
<tr><td><strong>④ 自動化（Rotate）</strong></td><td>パスワードを定期的・利用後に自動で変更し、漏れても使えなくする</td><td>CPM（第8章）</td></tr>
</tbody></table></div>

<div class="callout analogy"><span class="ttl">ホテルの客室キー管理</span>
<p>ホテルではフロント（<strong>金庫＝保管</strong>）がカードキーを管理し、宿泊者本人だけに（<strong>制御</strong>）、滞在期間だけ有効なキーを渡します。廊下には防犯カメラ（<strong>監視</strong>）があり、チェックアウトするとキーは自動で無効化されて次の客用に作り直されます（<strong>自動化</strong>）。PAMはこれをITの特権IDに対して行います。</p>
</div>

<h2 id="s5">5. CyberArkの立ち位置</h2>
<p>CyberArkはPAM分野を代表するベンダーの1つで、Digital Vaultを中心とした特権アクセス管理製品から出発し、現在は人・機械・AIエージェントのIDを対象とした<strong>アイデンティティセキュリティ</strong>全体へ製品群を広げています。2026年2月にPalo Alto Networksによる買収が完了しており、製品群の全体像は第2章で学びます。</p>

<div class="callout tip"><span class="ttl">新人が最初に覚える言い回し</span>
<p>お客様や他部署に説明するときは「CyberArkは、特権IDのパスワードを<strong>金庫で預かり</strong>、<strong>必要な人だけに使わせ</strong>、<strong>使った操作を録画し</strong>、<strong>パスワードを自動で変える</strong>製品です」と言えばまず伝わります。</p>
</div>

<div class="sh"><h4>🏢 Self-Hosted の場合</h4><ul><li>Vault・PVWA・CPM・PSM・PSM for SSH・PTAをすべて自社で構築・運用する</li><li>各コンポーネントからVaultへ TCP 1858（既定）で接続</li><li>Web画面（PVWA）はIIS上に自社で構築</li></ul></div>
<div class="pc"><h4>☁ Privilege Cloud の場合</h4><ul><li>Vaultと管理ポータル（PVWA相当）はSaaSとして提供される</li><li>顧客側のコネクタは <strong>Connector Managementエージェント＋PSM</strong> が推奨構成。パスワード変更はSaaSの <strong>Secrets Rotation Service</strong> がエージェント経由で実行（CPMをコネクタに置く構成も選択可）</li><li>SSH中継はPSM for SSH（Unixコネクタ）、LDAP・SIEM連携はSecure Tunnel</li><li>コネクタからSaaSへの外向き通信は TCP 443 と 1858</li><li>脅威検知はSaaSのThreat Detection and Response（ITDR）等で提供</li></ul></div>
</div>

<div class="ch-hero">
  <div class="eyebrow">CHAPTER 04｜コア構成</div>
  <h1>Digital Vaultとセキュリティ</h1>
  <p class="lead">Vaultは「会社中のマスターキーが入った金庫」です。金庫そのものが破られたら終わりなので、Vaultは他のサーバとはまったく違う考え方で守られます。</p>
  <h4>この章の全体像</h4>
  <p class="small">Vaultの設計原則（専用・堅牢化・非ドメイン）→ 多層防御と暗号化 → 組み込みユーザーと緊急用Master → 可用性（DR・バックアップ）→ フェイルオーバーの流れ</p>
  <h4>この章のゴール</h4>
  <ul class="goal-list">
    <li>Vaultを「ドメインに参加させない」「他のソフトを入れない」理由を説明できる</li>
    <li>Masterユーザー・Administratorユーザー・Auditors等の組み込みユーザー／グループの違いを説明できる</li>
    <li>DR Vaultへの切り替えの流れと、コンポーネント側の動きを説明できる</li>
  </ul>
  <div class="ch-meta"><span class="chip acc">目安 70分</span><span class="chip">前提：第3章</span></div>
</div>

<h2>1. Vaultの設計原則</h2>
<div class="callout analogy"><span class="ttl">銀行の地下金庫は「普通の部屋」ではない</span>
<p>銀行の金庫室は、窓がなく、入口は1つだけ、壁は分厚く、清掃業者も自由には入れません。Vaultサーバも同じで、<strong>入口（通信ポート）は原則1つ</strong>、<strong>余計なもの（他のソフトウェア・ドメイン参加）は置かない</strong>のが基本です。</p>
</div>
<div class="table-wrap"><table>
<thead><tr><th>原則</th><th>内容</th><th>理由</th></tr></thead>
<tbody>
<tr><td><strong>専用サーバ</strong></td><td>Vaultサーバには他の役割（ファイルサーバ、監視エージェント等）を同居させない</td><td>他ソフトの脆弱性が攻撃の入口になる（攻撃対象領域の拡大）</td></tr>
<tr><td><strong>ドメイン非参加</strong></td><td>Active Directoryドメインに参加させない（ワークグループ）</td><td>ドメインが侵害されても、ドメイン管理者がVaultサーバに入れないようにする</td></tr>
<tr><td><strong>堅牢化（ハードニング）</strong></td><td>インストール時に不要なサービス停止・OS設定の強化が自動で行われる</td><td>攻撃に使える機能を最初から取り除く</td></tr>
<tr><td><strong>専用ファイアウォール</strong></td><td>VaultがWindowsファイアウォールを制御し、既定ではVaultプロトコル（TCP 1858）のみ受け付ける</td><td>入口を1つに絞り、不要な通信を遮断する</td></tr>
<tr><td><strong>物理的・論理的なアクセス制限</strong></td><td>コンソールアクセスできる人を最小限にし、仮想環境ならハイパーバイザ管理者も統制する</td><td>OSより下のレイヤ（物理・仮想基盤）からの攻撃を防ぐ</td></tr>
</tbody></table></div>

<div class="callout danger"><span class="ttl">よくある失敗</span>
<ul>
<li>「監視のために」Vaultサーバに汎用の監視エージェントやリモート管理ツールを入れてしまう</li>
<li>「管理が楽だから」Vaultをドメインに参加させてしまう</li>
<li>FWの例外を増やし、RDPを常時開放してしまう</li>
</ul>
<p>いずれも金庫室に裏口を作る行為です。必要な場合は公式のガイドに沿って、例外を最小限にします。公式GitHubの <code>CYBRHardeningCheck</code> のように、堅牢化状態（ドメイン非参加かどうか等）を確認するツールも提供されています。</p>
</div>

<h2>2. 多層防御と暗号化</h2>
<p>Vaultは、1つの対策が破られても次の対策で守る<strong>多層防御</strong>の考え方で設計されています。</p>
<div class="grid">
<div class="card"><h4>🔒 通信の暗号化</h4><p class="small">コンポーネントとVault間の通信は暗号化される。</p></div>
<div class="card"><h4>🧱 ファイアウォール</h4><p class="small">Vault自身がFWを管理し、許可された通信のみ受け付ける。</p></div>
<div class="card"><h4>🪪 認証</h4><p class="small">パスワード、LDAP、RADIUS、PKI、SAMLなど多様な認証方式と多要素認証。</p></div>
<div class="card"><h4>🗝 アクセス制御</h4><p class="small">Safe単位の細かい権限。Vault管理者であっても権限がなければ中身は見えない設計が可能。</p></div>
<div class="card"><h4>📜 監査</h4><p class="small">すべての操作を改ざん困難な形で記録。</p></div>
<div class="card"><h4>🔐 保存データの暗号化</h4><p class="small">格納データは階層的な鍵で暗号化して保存。</p></div>
</div>

<h3>階層的な暗号化（鍵の入れ子）</h3>
<p>Vaultに保存されるファイルは、ファイルごとの鍵で暗号化され、その鍵はSafeの鍵で、Safeの鍵はVaultのServer Keyで暗号化されます。</p>
<script class="dg" type="application/json">
{"w":800,"h":150,"title":"Vaultの鍵階層","caption":"図4-1：鍵の入れ子構造（概念図）",
"nodes":[
{"id":"sk","x":10,"y":40,"w":150,"h":70,"label":"Server Key","sub":"最上位の鍵\n（HSM保管も可）","kind":"vault"},
{"id":"safe","x":230,"y":40,"w":150,"h":70,"label":"Safe Key","sub":"Safeごとの鍵","kind":"vault"},
{"id":"file","x":450,"y":40,"w":150,"h":70,"label":"File Key","sub":"ファイルごとの鍵","kind":"vault"},
{"id":"data","x":670,"y":40,"w":120,"h":70,"label":"データ","sub":"パスワード・録画等","kind":"target"}],
"edges":[{"from":"sk","to":"safe","label":"暗号化"},{"from":"safe","to":"file","label":"暗号化"},{"from":"file","to":"data","label":"暗号化"}]}
</script>
<div class="callout analogy"><span class="ttl">マトリョーシカ型の鍵束</span>
<p>書類（データ）は鍵付きの封筒（File Key）に入り、その封筒の鍵はさらに部屋ごとの金庫（Safe Key）に、部屋の金庫の鍵は建物全体の親鍵（Server Key）で守られています。<strong>Vaultのディスクだけを盗まれても、親鍵がなければ中身は読めません。</strong></p>
</div>
<p>Server Keyのほかに<strong>リカバリキー（Recovery Key）</strong>があります。リカバリキーの秘密鍵は一般に「Master CD」と呼ばれる媒体に格納され、<mark>Vaultサーバとは別の場所（オフライン）で厳重に保管</mark>します。Masterユーザーでのログインや緊急時の復旧に使われます。</p>

<h2>3. 組み込みユーザーとグループ</h2>
<p>Vaultはインストール時に、いくつかのユーザーとグループを自動作成します。代表的なものを覚えましょう。</p>
<div class="table-wrap"><table>
<thead><tr><th>名前</th><th>種類</th><th>特徴</th><th>運用上の扱い</th></tr></thead>
<tbody>
<tr><td><strong>Master</strong></td><td>ユーザー</td><td>「Authorize password requests（承認）」を除くすべてのSafe権限を持ち、どのSafeからも削除できない。System Safeを編集できる唯一のユーザー。ログインはPrivate Recovery Keyを含む<strong>Master CD</strong>でのみ可能</td><td><strong>緊急時専用（ブレークグラス）</strong>。普段は絶対に使わない</td></tr>
<tr><td><strong>Administrator</strong></td><td>ユーザー</td><td>初期の管理者ユーザー。Masterと違い、新しいSafeへ自動で全権限が付くわけではない</td><td>初期構築後は厳重保管し、日常は個人名の管理者アカウントを使う</td></tr>
<tr><td><strong>Vault Admins</strong></td><td>グループ</td><td>Vaultの管理機能（PVWAの管理画面等）を使える管理者グループ</td><td>メンバーは最小限に。LDAPグループをマッピングすることが多い</td></tr>
<tr><td><strong>Auditors</strong></td><td>グループ</td><td>View audit と View Safe Members 権限を持ち、Safeの内容・操作ログ・オーナー一覧を参照できる（組み込みのAuditorユーザーが所属）</td><td>監査担当・内部監査部門</td></tr>
<tr><td>Backup Users / DR Users / Operators など</td><td>グループ・ユーザー</td><td>Backup Users・DR UsersはBackup Safe権限（バックアップ・DR複製用）、OperatorsはManage Safe権限（Safeのプロパティ変更等。中身は見えない）</td><td>用途専用。対話ログインには使わない</td></tr>
</tbody></table></div>
<div class="point-box">
  <div class="big">🚨</div>
  <div><p class="one">Masterユーザーは「非常口の鍵」。使ったら必ず事後報告・記録・原因対策。</p>
  <p class="small muted">Masterの利用は、全管理者がロックアウトされた等の非常事態に限ります。利用手順（誰が立ち会い、どこから鍵を出し、どう記録するか）を事前に文書化しておくのが設計者の仕事です。</p></div>
</div>
<div class="callout verify"><span class="ttl">公式ドキュメントで確認済み（2026-10-19）</span><p>出典：PAM - Self-Hosted「Predefined users and groups」。なお、<strong>Master以外の組み込みユーザーは作成時点では無効（disabled）</strong>で、使うには有効化が必要です。組み込みユーザー・グループを自動追加されたSafeから外せるかどうかは、DBParm.ini の設定で決まります。</p></div>

<h2>4. 可用性：DR・バックアップ・冗長化</h2>
<p>Vaultが止まるとPAM全体が止まり、特権作業ができなくなります。そのため可用性設計は必須です。</p>
<div class="table-wrap"><table>
<thead><tr><th>方式</th><th>概要</th><th>守れるもの</th></tr></thead>
<tbody>
<tr><td><strong>DR Vault</strong></td><td>別サイトに待機用Vaultを置き、DRサービスがデータを継続的に複製。本番障害時にDR Vaultを起動して切り替える</td><td>サイト障害・サーバ障害</td></tr>
<tr><td><strong>クラスタ構成</strong></td><td>同一サイト内で2台のVaultを共有ストレージ等で冗長化（Cluster Vault）</td><td>サーバ単体の障害（同一サイト内）</td></tr>
<tr><td><strong>バックアップ</strong></td><td>専用のバックアップユーティリティ（PAReplicate等）でVaultデータを取得し、外部のバックアップ製品で保管</td><td>論理障害・誤操作・ランサムウェア（世代管理）</td></tr>
<tr><td><strong>コンポーネント冗長化</strong></td><td>PVWA・PSMは複数台＋ロードバランサ、CPMは担当範囲を分けて複数台</td><td>コンポーネント障害・性能</td></tr>
</tbody></table></div>
<div class="callout key"><span class="ttl">DRとバックアップは別物</span>
<p>DRは「最新の状態をすぐに引き継ぐ」仕組みなので、<strong>誤って削除したデータもそのまま複製されます</strong>。過去の状態に戻すにはバックアップが必要です。両方を設計しましょう。</p>
</div>

<figure class="flow">
<div class="flow-head"><span class="flow-title">図4-2：本番Vault障害時のDR切り替え（フェイルオーバー）</span></div>
<script class="dg" type="application/json">

<ol class="flow-desc">
<li data-label="平常時の複製">平常時、DRサービスが本番Vault（<code>hk-vault01</code>）のデータとメタデータをDR Vault（<code>hk-vault-dr01</code>）へ継続的に複製します。DR Vaultは待機状態です。</li>

<li data-label="コンポーネント切替">PVWA・CPM・PSM等は、設定ファイル（Vault接続情報）に複数のVaultアドレスを登録しておくことで、応答のあるVaultへ接続を切り替えます。</li>

<div class="callout tip"><span class="ttl">DR訓練は「やってみないと分からない」</span>
<p>FWでDRサイトへの1858が開いていない、DR側PSMの録画保存先が足りない、手順書が古い…といった問題は、訓練で初めて見つかることがほとんどです。</p>
</div>

<h2 id="dual">Self-Hosted と Privilege Cloud の違い（この章のポイント）</h2>
<div class="dual">
<div class="sh"><h4>🏢 Self-Hosted の場合</h4><ul><li>Vaultの堅牢化・パッチ・鍵（Server Key／Master CD）・DR・バックアップはすべて自社の責任</li><li>組み込みユーザー（Master・Administrator 等）とグループ（Vault Admins・Auditors 等）を自社で管理</li></ul></div>
<div class="pc"><h4>☁ Privilege Cloud の場合</h4><ul><li>Vaultの運用・堅牢化・DR・バックアップはサービス提供側の責任範囲</li><li>顧客が守るのは、管理者の役割（Privilege Cloud Administrators／Auditors／Safe Managers）、認証基盤（Identity）、コネクタサーバの堅牢化（提供されるGPO堅牢化パッケージ）</li><li>組み込みユーザーは編集・削除できず、アプリ用の組み込みユーザーはライセンスを消費しない</li><li>IdP障害などに備えた緊急時のログイン手順は、SaaSでも顧客側で用意する</li></ul></div>
</div>
<p class="small muted">出典（2026-10-19確認）：Predefined users and groups、Privilege Cloud built-in users、ISPSS user roles、Upgrade connector components</p>

<div class="callout danger"><span class="ttl">「HTTPSだけ開ければよい」は誤り</span>
<p>Privilege Cloudのコネクタは 443 に加えて <strong>TCP 1858</strong> の外向き通信が必要です。プロキシ経由でHTTPSだけを許可している環境では、1858 の扱いを事前にネットワーク担当と決めておかないと、コネクタがVaultに接続できません。また、IdiraはSaaS側で<strong>特定IPからのインバウンドのみ許可</strong>するため、コネクタの<strong>送信元となる公開IPアドレスをテクニカルサポートに届け出る</strong>必要があります（送信元IPは常に同じになるよう経路を固定）。IPv4のみ対応です。</p>
</div>
<div class="callout verify"><span class="ttl">確認ポイント</span><p>導入手順・前提条件（OS、.NET、通信要件、トークン有効期限）は更新が頻繁です。必ず最新の「Connector Management」ドキュメントで確認してから作業してください。</p></div>

<div class="callout key"><span class="ttl">Privilege Cloudでの接続方式の選び方</span>
<p>公式ドキュメントでは、RDP・SSH・データベースへの接続は <strong>SIA（Secure Infrastructure Access）</strong> の利用が推奨されています（軽量なコネクタ、高可用性・負荷分散を内蔵、更新時の停止がほぼない）。Webサイト・クラウドコンソール・ESX/vCenter・ファットクライアントへの接続や高度なカスタマイズが必要な場合は <strong>PSM</strong> を使います。詳しくは第10章・第14章。</p>
</div>

  <h1>Safe設計と権限モデル</h1>
  <p class="lead">Safeの切り方は、あとから変えるのが大変な「家の間取り」です。権限は「誰がその部屋に入れて、何ができるか」。ここがCyberArk設計の中心です。</p>

<h2>1. Safeとは</h2>
<p><strong>Safe</strong>は、アカウント（特権IDの資格情報）をまとめて入れておく<strong>箱</strong>であり、<strong>アクセス権を付与する単位</strong>です。</p>
<div class="callout analogy"><span class="ttl">銀行の貸金庫の「箱」</span>
<p>銀行の金庫室（Vault）の中には、たくさんの貸金庫の箱（Safe）が並んでいます。箱ごとに「開けられる人の名簿（Safe Member）」があり、名簿にない人は、たとえ銀行員（Vault管理者）でも勝手に中を見られないようにできます。<strong>権限は「アカウント1件ずつ」ではなく「箱ごと」に付ける</strong>のがポイントです。</p>
</div>

<div class="point-box">
  <div class="big">📦</div>
  <div><p class="one">同じ人たちが、同じ使い方をするアカウントを、同じSafeに入れる。</p>
  <p class="small muted">権限がSafe単位で付くため、「使う人」と「使い方」がそろっているかがSafe分割の判断基準になります。</p></div>
</div>

<h2>2. Safe設計の考え方</h2>
<h3>分割の観点</h3>
<div class="table-wrap"><table>
<thead><tr><th>観点</th><th>例</th><th>分ける理由</th></tr></thead>
<tbody>
<tr><td>管理する組織・チーム</td><td>インフラ課／DB課／ネットワーク課</td><td>使う人が違う</td></tr>
<tr><td>環境</td><td>本番（PRD）／検証（STG）／開発（DEV）</td><td>本番だけ承認や録画を厳しくしたい</td></tr>
<tr><td>ターゲット種別</td><td>Windows／Linux／DB／NW機器</td><td>担当CPM・ポリシーが異なることが多い</td></tr>
<tr><td>重要度</td><td>ドメイン管理者などの最重要アカウント</td><td>最小人数・二重承認など特別扱い</td></tr>
<tr><td>利用者種別</td><td>人が使う／アプリが使う（第13章）</td><td>アプリ用は人に見せない権限設計</td></tr>
<tr><td>外部委託</td><td>保守ベンダー用</td><td>契約単位で付与・剥奪したい</td></tr>
</tbody></table></div>

<h3>命名規則の例（ヒカリ精機）</h3>
<pre><code>[会社]-[環境]-[組織]-[種別]-[用途]
例) HK-PRD-INF-LNX-ROOT   … 本番 インフラ課 Linux rootアカウント
    HK-PRD-DBA-ORA-SYS    … 本番 DB課 Oracle 管理者
    HK-STG-INF-WIN-LOCAL  … 検証 インフラ課 Windowsローカル管理者
    HK-PRD-APP-ORA-APPUSR … 本番 アプリ用 Oracle 接続ユーザー（第13章）
    HK-PRD-VND-NEXT-WIN   … 本番 委託先（ネクスト保守）用 Windows</code></pre>
<div class="callout danger"><span class="ttl">Safe名には制約がある</span>
<p>公式ドキュメントでは、Safe名は<strong>最大28文字</strong>で、<code>\ / : * &lt; &gt; . | ? " % &amp; +</code> などの文字は使えません（Privilege Cloudでは <code>;</code> も不可）。Secrets Hubでクラウドへ同期する場合は、Azure Key Vault（英数字とハイフンのみ）など同期先の命名制約も受けます。また<strong>Safe名は後から変えにくい</strong>（連携設定・スクリプト・レポートが名前に依存する）ため、命名規則は導入初期に決めて文書化しましょう。</p>
</div>

<div class="callout tip"><span class="ttl">ちょうどよい粒度</span>
<p>「全部1つのSafe」は権限が粗すぎ、「サーバ1台に1Safe」は管理不能になります。<strong>「権限付与の単位がそろう最大のまとまり」</strong>を目安にしましょう。</p>
</div>

<h3>Safeのその他の主な設定</h3>
<ul>
<li><strong>担当CPM</strong>：そのSafe内のアカウントのパスワード管理をどのCPMが担当するか（第8章）</li>
<li><strong>保持設定</strong>：過去のパスワード版や操作履歴をどれだけ保持するか（世代数または日数）</li>
<li><strong>説明・オーナー情報</strong>：Safeの責任者を明記（棚卸しで必須）</li>
</ul>

<h2>3. Safeメンバーと権限</h2>
<p>Safeメンバーには、Vaultユーザー、LDAP（AD）ユーザー、グループを追加できます。<mark>個人ではなくADグループを登録</mark>しておけば、異動・退職時はADのグループ変更だけで済みます。</p>

<h3>「Use」と「Retrieve」の違い（最重要）</h3>
<div class="grid-2">
<div class="card" style="border-color:var(--ok)"><h4>✅ List ＋ Use</h4><p>PSM経由で<strong>接続はできるが、パスワードは見えない</strong>。<br>→ 一般の運用担当・委託先に推奨。パスワードを知る人が増えないので、変更頻度を下げても安全性を保ちやすい。</p></div>
<div class="card" style="border-color:var(--warn)"><h4>⚠ List ＋ Retrieve</h4><p>パスワードを<strong>表示・コピーできる</strong>。<br>→ PSMで対応できない機器や緊急時など、必要な人に限定。見た後はワンタイムパスワード等で変更する運用と組み合わせる。</p></div>
</div>
<div class="callout key"><span class="ttl">迷ったら「Use」</span>
<p>「パスワードを見せない」ことがCyberArkの最大の価値の1つです。Retrieveは<strong>理由がある人にだけ</strong>付けます。</p>
</div>

<tr><td>上級運用担当（<code>GG_PAM_INF_ADV</code>）</td><td>List, Use, Retrieve</td></tr>
<tr><td>承認者（<code>GG_PAM_INF_APPROVERS</code>）</td><td>List, Authorize account requests</td></tr>
<tr><td>アカウント管理者（<code>GG_PAM_INF_ACCTMGR</code>）</td><td>List, Add, Update content/properties, Initiate CPM operations, Delete</td></tr>
<tr><td>Safe管理者（<code>GG_PAM_ADMINS</code>）</td><td>Manage Safe, Manage Safe members, View audit, View members（※日常的なアカウント利用権限は付けない）</td></tr>
<tr><td>監査担当（<code>GG_PAM_AUDITORS</code>）</td><td>List, View audit log, View Safe members</td></tr>
</tbody></table></div>
<div class="callout danger"><span class="ttl">職務分掌（SoD）を崩さない</span>
<p>「Safeのメンバーを管理できる人」が「自分にRetrieveを付けて使う」ことができると、統制が骨抜きになります。<strong>管理する人と使う人を分ける</strong>、自分自身への権限付与を監査ログで監視する、などの対策を組み合わせます。</p>
</div>

  <h1>アカウントとプラットフォーム</h1>
  <p class="lead">アカウントは「管理したい鍵1本1本」、プラットフォームは「その鍵の取扱説明書」です。取扱説明書を正しく選べば、CPMとPSMが正しく動きます。</p>
  <h4>この章の全体像</h4>
  <p class="small">アカウントの構成要素 → プラットフォームとは → 主な設定項目 → 連携アカウント（Logon / Reconcile）→ 依存先 → アカウント登録（オンボーディング）の流れ</p>

    <li>Logon AccountとReconcile Accountが必要になる場面を説明できる</li>
  </ul>

</div>

<h2>1. アカウントの構成要素</h2>
<div class="table-wrap"><table>
<thead><tr><th>項目</th><th>例（hk-web01のroot）</th><th>説明</th></tr></thead>
<tbody>
<tr><td>Safe</td><td><code>HK-PRD-INF-LNX-ROOT</code></td><td>格納先＝誰が使えるかが決まる</td></tr>
<tr><td>Platform</td><td>HK-Unix-SSH-Root（Unix via SSHを複製）</td><td>管理ルールと接続方法が決まる</td></tr>
<tr><td>Address</td><td><code>hk-web01.hikari.example</code>（10.30.1.11）</td><td>接続先。DNS名推奨</td></tr>
<tr><td>Username</td><td><code>root</code></td><td>管理対象のユーザー名</td></tr>
<tr><td>Secret</td><td>パスワード または SSH秘密鍵</td><td>Vaultに暗号化保管される</td></tr>
<tr><td>Account Name</td><td>自動生成（例：Operating System-HK-Unix-SSH-Root-hk-web01…-root）</td><td>Vault内の識別名</td></tr>
<tr><td>Linked Accounts</td><td>Logon：<code>opsadmin</code>／Reconcile：調整用アカウント</td><td>管理を補助する別アカウント</td></tr>
<tr><td>自動管理の状態</td><td>有効／無効（無効時は理由を記録）</td><td>CPMの管理対象かどうか</td></tr>
</tbody></table></div>

<h2>2. プラットフォームとは</h2>
<div class="callout analogy"><span class="ttl">家電の「取扱説明書」</span>
<p>同じ「電源を入れる」でも、テレビと洗濯機では手順が違います。CPMやPSMも、Windowsのローカル管理者とOracleのSYSでは、パスワードの変え方・接続の仕方が違います。<strong>プラットフォームは、ターゲットの種類ごとの取扱説明書</strong>です。</p>
</div>
<p>CyberArkには、Windows・Unix/Linux・データベース・ネットワーク機器・クラウドなど、多数のプラットフォームのテンプレートが用意されています。足りないものは公式マーケットプレイス等のプラグインや、独自開発（プラグインの作成）で追加できます。</p>

<h3>主な設定項目</h3>
<div class="table-wrap"><table>
<thead><tr><th>設定カテゴリ</th><th>代表的な設定</th></tr></thead>
<tbody>
<tr><td>自動パスワード管理</td><td>定期変更の間隔、定期検証の間隔、不一致時に自動で調整（Reconcile）するか、変更時刻の制限（業務時間外のみ等）</td></tr>
<tr><td>パスワードポリシー</td><td>長さ、大文字・小文字・数字・記号の最低数、使用禁止文字（ターゲットが受け付けない記号の除外）</td></tr>
<tr><td>接続コンポーネント</td><td>PSM経由で使う接続方式（RDP、SSH、SQLクライアント、Webアプリ等）と、使用するPSMサーバ</td></tr>
<tr><td>ポリシーの例外</td><td>Master Policyの設定をこのプラットフォームだけ変更（例：本番DBだけ二重承認）</td></tr>
<tr><td>プラグイン固有の設定</td><td>接続ポート、プロンプト文字列、タイムアウトなど</td></tr>
</tbody></table></div>
<div class="callout key"><span class="ttl">既定プラットフォームは直接いじらず「複製」して使う</span>
<p>標準テンプレートを直接変更すると、どこを変えたか分からなくなり、バージョンアップ時の比較も困難になります。<strong>「複製 → 自社用の名前を付ける → 変更」</strong>が鉄則です。名前に用途を入れておく（例：<code>HK-Win-Local-PRD</code>）と、棚卸しや調査が楽になります。</p>
</div>
<div class="callout danger"><span class="ttl">パスワードポリシーとターゲットの不一致に注意</span>
<p>ターゲットが受け付けない記号や長さをCPMが生成すると、変更が失敗します。例えば一部のネットワーク機器やアプリでは特定の記号が使えません。プラットフォームの「使用禁止文字」で除外しましょう。</p>
</div>

<h2>3. 連携アカウント（Linked Accounts）</h2>
<div class="grid-2">
<div class="card"><h4>🚪 Logon Account（ログオン用）</h4>
<p class="small">対象アカウントで<strong>直接ログインできない</strong>ときに使う「入口用」のアカウント。</p>
<p class="small">例：<code>hk-web01</code> は <code>PermitRootLogin no</code>（rootでの直接SSH禁止）。CPMは一般ユーザー <code>opsadmin</code> でログインし、そこから <code>su</code> でrootになってパスワードを変更する。</p></div>
<div class="card"><h4>🛠 Reconcile Account（調整用）</h4>
<p class="small">対象アカウントのパスワードが<strong>Vaultと食い違ったとき</strong>に、強制的にリセットするための高権限アカウント。</p>
<p class="small">例：Windowsドメインアカウントの調整には、パスワードリセット権限を持つ専用のドメインアカウントを使う。Linuxでは調整用の管理者アカウント（sudo可能）を使う。</p></div>
</div>
<div class="callout tip"><span class="ttl">調整用アカウント自体もCyberArkで管理する</span>
<p>Reconcile Accountは強い権限を持つため、それ自体もSafeに格納してCPMで管理します。ただし「調整用アカウントのパスワードが不一致になると調整できない」ので、<strong>専用Safe・厳格な権限・監視</strong>を設けます。</p>
</div>

<h2>4. 依存先（Usages / Dependencies）</h2>
<p>Windowsのサービス、スケジュールタスク、IISのアプリケーションプール、設定ファイルなどが、ある特権アカウントのパスワードを使っている場合があります。パスワードだけ変えると、<mark>それらが起動できなくなり障害</mark>になります。</p>
<p>CyberArkでは、こうした使用箇所を<strong>依存先</strong>として登録し、CPMがパスワード変更時に併せて更新できます。導入前の調査（どのサービスがどのアカウントで動いているか）が重要です。</p>

<h2>5. アカウント登録（オンボーディング）の方法</h2>

<tr><td>一括登録（ファイル取り込み）</td><td>導入初期の大量登録</td></tr>
<tr><td>REST API・自動化ツール</td><td>サーバ構築の自動化と連動して登録（第15章）</td></tr>
<tr><td>Accounts Discovery ＋ 自動オンボーディングルール</td><td>ネットワーク上の特権アカウントを発見し、ルールに合うものを自動で登録</td></tr>
</tbody></table></div>

<div class="ch-hero">
  <div class="eyebrow">CHAPTER 08｜設計・設定</div>
  <h1>CPMとパスワードライフサイクル</h1>
  <p class="lead">CPMは「定期的に鍵を作り替える錠前師」です。変更（Change）・検証（Verify）・調整（Reconcile）の3つの仕事と、失敗したときの調べ方を身につけます。</p>
  <h4>この章の全体像</h4>
  <p class="small">CPMの3つの仕事 → 実行のきっかけ → 変更処理の内部フロー → 調整（Reconcile）のフロー → よくある失敗と切り分け → CPMの配置設計</p>
  <h4>この章のゴール</h4>
  <ul class="goal-list">
    <li>Change・Verify・Reconcileの違いを説明できる</li>
    <li>パスワード変更時に「パスワードが失われない」仕組みを説明できる</li>
    <li>CPMエラーの典型原因を挙げ、ログを見て切り分けを始められる</li>
  </ul>
  <div class="ch-meta"><span class="chip acc">目安 90分</span><span class="chip">前提：第7章</span><span class="chip warn">重点章</span></div>
</div>

<h2>1. CPMの3つの仕事</h2>
<div class="callout analogy"><span class="ttl">マンションの鍵を管理する錠前師</span>
<p><strong>変更（Change）</strong>：定期的に鍵穴ごと新しい鍵に取り替える。<br>
<strong>検証（Verify）</strong>：管理室にある鍵で、本当にドアが開くか試してみる。<br>
<strong>調整（Reconcile）</strong>：誰かが勝手に鍵を替えてしまい管理室の鍵で開かないとき、管理会社のマスター権限で鍵を強制的に作り直す。</p>
</div>
<div class="table-wrap"><table>
<thead><tr><th>操作</th><th>何をする</th><th>使う権限</th><th>主なきっかけ</th></tr></thead>
<tbody>
<tr><td><strong>Change</strong></td><td>新しいパスワードを生成し、ターゲットとVaultの両方を更新</td><td>対象アカウント自身（またはLogon Account経由）</td><td>定期変更、手動実行、利用後（ワンタイム）</td></tr>
<tr><td><strong>Verify</strong></td><td>Vaultのパスワードで実際にログインできるか確認</td><td>対象アカウント自身</td><td>定期検証、手動実行、登録時</td></tr>
<tr><td><strong>Reconcile</strong></td><td>不一致のパスワードを、高権限アカウントで強制リセット</td><td><strong>Reconcile Account</strong></td><td>検証失敗時（自動設定時）、手動実行</td></tr>
</tbody></table></div>

<div class="point-box">
  <div class="big">🔁</div>
  <div><p class="one">Verifyで「ズレ」に気づき、Reconcileで「ズレ」を直し、Changeで「漏れても使えない」状態を保つ。</p>
  <p class="small muted">定期変更・定期検証の間隔はMaster Policyとプラットフォームで決めます（例：変更90日ごと、検証7日ごと。値は組織の規程に合わせる）。</p></div>
</div>

<h2>2. 変更処理の内部フロー</h2>
<p>パスワード変更で一番怖いのは「ターゲットだけ新しいパスワードに変わったのに、Vaultに保存できず、誰も新しいパスワードを知らない」状態です。CPMはこれを避けるため、<strong>先にVaultへ新パスワードを控えてから</strong>ターゲットを変更します。</p>

<figure class="flow">
<div class="flow-head"><span class="flow-title">図8-1：CPMによるパスワード変更（Change）</span></div>
<script class="dg" type="application/json">
{"w":800,"h":270,
"nodes":[
{"id":"vault","x":10,"y":60,"w":160,"h":70,"label":"Vault","sub":"現在PW／新PW（控え）","kind":"vault","s":[1,3,6]},
{"id":"cpm","x":320,"y":60,"w":160,"h":70,"label":"CPM","sub":"hk-cpm01","kind":"comp","s":[1,2,3,4,5,6]},
{"id":"t","x":630,"y":60,"w":160,"h":70,"label":"hk-web01","sub":"root","kind":"target","s":[4,5]}],
"edges":[
{"from":"vault","to":"cpm","label":"①対象と現在PWを取得","curve":-100,"s":[1]},
{"from":"cpm","to":"vault","label":"③新PWを控えとして保存","curve":-100,"ly":18,"s":[3]},
{"from":"cpm","to":"t","label":"④ログインして変更","curve":-90,"s":[4]},
{"from":"t","to":"cpm","label":"⑤新PWで確認","curve":-90,"ly":18,"s":[5]},
{"from":"cpm","to":"vault","label":"⑥新PWを正式な値に確定","curve":-230,"ly":20,"s":[6]}]}
</script>
<ol class="flow-desc">
<li data-label="対象の取得">CPMは定期的にVaultを確認し、変更時期が来たアカウント（または手動で変更指示されたアカウント）と、その現在のパスワードを取得します。</li>
<li data-label="新パスワード生成">プラットフォームのパスワードポリシー（長さ・文字種・禁止文字）に従い、新しいランダムなパスワードを生成します。</li>
<li data-label="Vaultに控える">ターゲットを変更する前に、新パスワードをVaultへ「控え（変更途中の値）」として保存します。<strong>途中で失敗しても新パスワードが失われない</strong>ための仕組みです。</li>
<li data-label="ターゲットを変更">現在のパスワード（またはLogon Account経由）でターゲットにログインし、パスワードを新しい値に変更します。依存先（サービス等）があれば併せて更新します。</li>
<li data-label="新パスワードで確認">新しいパスワードで実際にログインできることを確認します。</li>
<li data-label="正式な値に確定">成功したら、Vault上で新パスワードを「現在の値」として確定し、旧パスワードは履歴として保持されます。処理結果は監査ログに記録されます。</li>
</ol>
</figure>

<h2>3. 調整（Reconcile）のフロー</h2>
<p>誰かがCyberArkを通さずにパスワードを変えた、OSを再構築した、バックアップから戻した——こうした理由でVaultとターゲットのパスワードがズレることがあります。</p>
<figure class="flow">
<div class="flow-head"><span class="flow-title">図8-2：検証失敗から調整（Reconcile）まで</span></div>
<script class="dg" type="application/json">
{"w":800,"h":330,
"nodes":[
{"id":"cpm","x":320,"y":120,"w":160,"h":60,"label":"CPM","kind":"comp","s":[1,2,3,4,5]},
{"id":"vault","x":10,"y":120,"w":160,"h":60,"label":"Vault","sub":"Vault上のPW","kind":"vault","s":[2,3,5]},
{"id":"t","x":630,"y":30,"w":160,"h":60,"label":"hk-fs01","sub":"Administrator","kind":"target","s":[1,4]},
{"id":"rec","x":630,"y":210,"w":160,"h":60,"label":"調整用アカウント","sub":"svc_pam_reconcile","kind":"vault","s":[3,4]}],
"edges":[
{"from":"cpm","to":"t","label":"①検証→ログイン失敗","s":[1]},
{"from":"cpm","to":"vault","label":"②「不一致」を記録","curve":-80,"ly":18,"s":[2]},
{"from":"vault","to":"cpm","label":"③調整用PW取得","curve":-80,"s":[3]},
{"from":"rec","to":"t","label":"④強制リセット","s":[4]},
{"from":"cpm","to":"rec","dashed":true,"s":[4]},
{"from":"cpm","to":"vault","label":"⑤新PWで同期回復","curve":-200,"ly":20,"s":[5]}]}
</script>
<ol class="flow-desc">
<li data-label="検証失敗">定期検証で、Vaultのパスワードでは <code>hk-fs01</code> のAdministratorにログインできませんでした。</li>
<li data-label="不一致を記録">アカウントは「不一致（未同期）」の状態として記録され、PVWAにもエラーとして表示されます。</li>
<li data-label="調整用アカウント取得">プラットフォームで「不一致時に自動調整」が有効なら（または手動でReconcileを実行すると）、CPMは関連付けられたReconcile Accountの資格情報をVaultから取得します。</li>
<li data-label="強制リセット">Reconcile Accountの権限でターゲットにログインし、対象アカウントのパスワードを新しい値に強制リセットします（現在のパスワードを知らなくてもリセットできる権限が必要）。</li>
<li data-label="同期回復">新パスワードをVaultに保存し、同期が回復します。<strong>なぜズレたのか（誰かが直接変更した？）は別途調査</strong>しましょう。不正の兆候である可能性もあります。</li>
</ol>
</figure>

<h2>4. よくある失敗と切り分け</h2>
<div class="table-wrap"><table>
<thead><tr><th>症状・エラーの傾向</th><th>よくある原因</th><th>確認すること</th></tr></thead>
<tbody>
<tr><td>接続できない・タイムアウト</td><td>FW遮断、DNS解決不可、ターゲット停止</td><td>CPMサーバからの疎通（ポート）・名前解決</td></tr>
<tr><td>認証失敗（Verify失敗）</td><td>パスワード不一致、アカウントロック・失効</td><td>ターゲット側のロック状態、直接変更の有無 → Reconcile</td></tr>
<tr><td>変更が拒否される</td><td>パスワードポリシー不一致（長さ・記号・履歴・最小有効期間）</td><td>ターゲットのポリシーとプラットフォーム設定を照合</td></tr>
<tr><td>権限不足</td><td>Logon/Reconcile Accountの権限不足、sudo設定不足</td><td>連携アカウントの権限・sudoers</td></tr>
<tr><td>Unix系で途中停止</td><td>プロンプト文字列の不一致（言語設定、独自のログインバナー等）</td><td>プラグインの詳細ログ、プロンプト設定</td></tr>
<tr><td>変更されない（処理されない）</td><td>CPMがSafeに割り当てられていない、時間帯制限、自動管理が無効</td><td>Safeの担当CPM、プラットフォームの実行時間帯、アカウントの状態</td></tr>
</tbody></table></div>
<div class="callout tip"><span class="ttl">ログの見方（Self-Hostedの例）</span>
<p>CPMサーバのログフォルダ（既定 <code>C:\Program Files (x86)\CyberArk\Password Manager\Logs</code>）には、すべてのメッセージを含む <code>pm.log</code> と、警告・エラーだけの <code>pm_error.log</code> があり（公式「CPM logs」で確認）、プラグインの詳細ログはデバッグを有効にしたときに出力されます。まずPVWA上のエラーメッセージで<strong>どの段階（接続・ログオン・変更・検証）で失敗したか</strong>を掴み、次にログで詳細を確認します。デバッグは調査後に必ず無効へ戻しましょう（ログ肥大化と情報露出の防止）。</p>
</div>
<div class="callout danger"><span class="ttl">連続失敗はアカウントロックを招く</span>
<p>パスワード不一致のまま検証を繰り返すと、ターゲット側のロックアウトポリシーでアカウントがロックされることがあります。特にドメインアカウントでは業務影響が大きいので、エラーが続く場合は早めに自動管理を一時停止し、原因を調べます。</p>
</div>

<h2>5. CPMの配置設計</h2>
<ul>
<li><strong>Safeごとに担当CPMを1つ割り当てる</strong>：アカウントが多い場合や、ネットワークが分かれている場合はCPMを複数台にして担当Safeを分けます。</li>
<li><strong>ターゲットに到達できる場所に置く</strong>：拠点やクラウドごとにCPMを置くことで、FW越えを最小化します（Privilege Cloudではコネクタとして配置）。</li>
<li><strong>処理の集中を避ける</strong>：一斉に変更日を迎えないよう、登録時期を分散させる・時間帯を設定するなどの工夫をします。</li>
</ul>

<h2 id="dual">Self-Hosted と Privilege Cloud の違い（この章のポイント）</h2>
<div class="dual">
<div class="sh"><h4>🏢 Self-Hosted の場合</h4><ul><li>CPMサーバ（Windows）を自社で構築し、Safeごとに担当CPMを割り当てる</li><li>ログは CPM の Logs フォルダ（pm.log／pm_error.log）</li></ul></div>
<div class="pc"><h4>☁ Privilege Cloud の場合</h4><ul><li>推奨は <strong>Secrets Rotation Service（SRS）</strong>：SaaS上でアクティブ-アクティブ構成・自動スケールするローテーションエンジン。変更処理はコネクタの Connector Management エージェント経由でターゲットに対して実行</li><li>エージェントはコネクタプール単位で冗長化（1プールに2エージェント）</li><li>SRSの制限：Credential Providerの dual account 管理や、管理者が自分専用の特権アカウントを作る機能に未対応、一部AWSリージョン非対応 など</li><li>従来どおりコネクタにCPMを置く構成も選択可能。CPMからSRSへの移行時は動作の違い（behavior changes）を確認</li></ul></div>
</div>
<p class="small muted">出典（2026-10-19確認）：Deploy Privilege Cloud Connector、Secrets Rotation Service architecture、Secrets Rotation limitations、CPM logs</p>

<h2>1. Master Policyとは</h2>
<p><strong>Master Policy</strong>は、組織全体に適用される特権アクセスの<strong>基本ルール</strong>です。すべてのアカウントに既定で適用され、特定のプラットフォームだけ別のルールにしたい場合は<strong>例外（Exception）</strong>を設定します。</p>
<div class="callout analogy"><span class="ttl">会社の「就業規則」と「部署別ルール」</span>
<p>全社員に適用される就業規則（Master Policy）があり、「工場の危険区域だけは2人作業必須」のように特定の場所だけ厳しいルール（例外）を上乗せします。全体は緩めに、重要な所だけ厳しく——が基本の考え方です。</p>
</div>

<h2>2. 主なルール</h2>
<div class="table-wrap"><table>
<thead><tr><th>分類</th><th>ルール</th><th>効果</th><th>向いている対象</th></tr></thead>
<tbody>
<tr><td rowspan="4">アクセスワークフロー</td><td><strong>理由の入力必須</strong></td><td>利用時に作業理由（チケット番号等）の入力を求め、監査ログに残す</td><td>ほぼ全て</td></tr>
<tr><td><strong>二重承認（Dual Control）</strong></td><td>利用前に承認者の承認を必要とする</td><td>本番DB、ドメイン管理者、委託先利用</td></tr>
<tr><td><strong>排他（Exclusive／チェックアウト）</strong></td><td>同時に1人しか使えない。使用中は他の人が使えない</td><td>誰が使ったかを1人に特定したいもの</td></tr>
<tr><td><strong>ワンタイムパスワード</strong></td><td>利用後（最低有効期間の経過後）に必ずパスワードを変更</td><td>Retrieve（表示）で使わせるもの</td></tr>
<tr><td rowspan="2">パスワード管理</td><td>定期変更の間隔</td><td>指定日数ごとにCPMが変更</td><td>全て</td></tr>
<tr><td>定期検証の間隔</td><td>指定日数ごとにCPMが検証</td><td>全て</td></tr>
<tr><td rowspan="2">セッション管理</td><td>PSM経由の接続を必須化（分離・監視）</td><td>直接接続（Retrieve後に自分で接続）ではなくPSM経由のみを許可</td><td>サーバ・DBの対話作業</td></tr>
<tr><td>セッションの記録・保存</td><td>録画・操作ログを保存</td><td>PSM経由の全セッション</td></tr>
<tr><td>監査</td><td>監査ログの保持期間</td><td>Vault上での監査データの保持日数</td><td>規程に合わせる</td></tr>
</tbody></table></div>
<h3>公式ドキュメント上の既定値（2026-10-19 確認）</h3>
<div class="table-wrap"><table>
<thead><tr><th>ルール（英語表記）</th><th>既定値</th></tr></thead>

<h3>排他とワンタイムの「最低有効期間」</h3>
<p>排他やワンタイムでは、<strong>最低有効期間（MinValidityPeriod）</strong>という考え方があります。パスワードを取り出した後、この期間はパスワードが変更されず作業できます。期間経過後（または利用者が返却＝チェックインした後）に、CPMがパスワードを変更し、排他ロックも解除されます。</p>

<div class="callout analogy"><span class="ttl">ホテルのカードキー</span>
<p><strong>二重承認</strong>＝予約時にフロントの承認が必要、<strong>排他</strong>＝1つの部屋は同時に1組しか泊まれない、<strong>ワンタイム</strong>＝チェックアウトしたらカードキーは無効化され、次の客には新しいキーが発行される、<strong>最低有効期間</strong>＝宿泊期間中はキーが使える。</p>
</div>

<h2>3. 例外（プラットフォーム単位）の付け方</h2>
<p>例えばヒカリ精機では、次のように設定しています（架空の例）。</p>
<div class="table-wrap"><table>
<thead><tr><th>対象</th><th>理由入力</th><th>二重承認</th><th>排他</th><th>ワンタイム</th><th>PSM必須・録画</th></tr></thead>
<tbody>
<tr><td>Master Policy（全体）</td><td>必須</td><td>なし</td><td>なし</td><td>なし</td><td>必須</td></tr>
<tr><td>例外：<code>HK-Win-DomainAdmin</code></td><td>必須</td><td><strong>あり</strong></td><td><strong>あり</strong></td><td><strong>あり</strong></td><td>必須</td></tr>
<tr><td>例外：<code>HK-Oracle-PRD</code></td><td>必須</td><td><strong>あり</strong></td><td>なし</td><td>なし</td><td>必須</td></tr>
<tr><td>例外：<code>HK-NW-Device</code>（PSM非対応の古い機器）</td><td>必須</td><td>なし</td><td><strong>あり</strong></td><td><strong>あり</strong></td><td>（Retrieveで利用）</td></tr>
</tbody></table></div>
<div class="callout tip"><span class="ttl">「承認疲れ」に注意</span>
<p>何でも二重承認にすると、承認者が中身を見ずに承認する「承認疲れ」が起き、統制が形骸化します。<strong>本当に重要なものだけ</strong>に絞り、それ以外は録画と事後監査で担保するのが現実的です。</p>
</div>

<figure class="flow">
<div class="flow-head"><span class="flow-title">図9-1：二重承認＋排他＋ワンタイムのワークフロー（本番ドメイン管理者の例）</span></div>

<p>ServiceNow等のチケットシステムと連携すると、「有効な変更チケットがある場合だけ利用を許可する」といった検証を自動化できます。承認の証跡がチケット側にも残り、監査対応が楽になります。対応製品・設定方法は公式ドキュメントで確認してください。</p>
</div>

  <h1>PSMによるセッション管理</h1>
  <p class="lead">PSMは「付き添い付きの作業部屋」です。利用者は部屋の中から作業し、鍵（パスワード）は付き添い役が開けてくれます。部屋の中はすべて録画されます。</p>

<h2>1. PSMの3つの価値</h2>
<div class="callout analogy"><span class="ttl">銀行の「貸金庫閲覧室」</span>
<p>貸金庫の中身を確認するとき、お客様は行員に付き添われてガラス張りの閲覧室に入ります。箱を開けるのは行員（パスワードはお客様に渡らない）、部屋には防犯カメラ（録画）、不審な動きがあれば警備員がすぐ止められます（監視・切断）。</p>
</div>
<div class="grid">
<div class="card"><h4>🧱 分離（Isolation）</h4><p class="small">利用者のPCとターゲットが直接つながらない。パスワードは利用者PCに渡らないため、<strong>利用者PCがマルウェアに感染していても資格情報を盗まれにくい</strong>。</p></div>
<div class="card"><h4>👁 監視（Monitoring）</h4><p class="small">監査担当がセッションをリアルタイムで見られる。危険な操作を見つけたら<strong>一時停止・強制切断</strong>できる。</p></div>
<div class="card"><h4>🎥 記録（Recording）</h4><p class="small">画面の録画と、キーストローク・SSHコマンド・SQL等の操作ログを保存。<strong>操作ログから録画の該当箇所へジャンプ</strong>して確認できる。</p></div>
</div>

<h2>2. 接続の内部フロー（Windows／RDP系）</h2>
<figure class="flow">
<div class="flow-head"><span class="flow-title">図10-1：PSM経由でWindowsサーバへ接続する内部の流れ</span></div>

<div class="callout tip"><span class="ttl">PSMAdminConnectとは</span>

</div>

<h2>3. 接続方法の種類</h2>
<div class="table-wrap"><table>
<thead><tr><th>方法</th><th>概要</th><th>向いている人</th></tr></thead>
<tbody>
<tr><td>PVWAから接続（RDPファイル）</td><td>PVWAで「Connect」→RDPファイルが開き、PCのRDPクライアントでPSMへ接続</td><td>標準的な利用者</td></tr>
<tr><td><strong>HTML5 Gateway</strong></td><td>RDPクライアント不要。ブラウザのタブ内でセッションを開く</td><td>RDPクライアントを使えない端末、委託先</td></tr>
<tr><td>ネイティブRDPクライアント（PSM for Windows）</td><td>PVWAを開かず、使い慣れたRDPクライアントからPSM経由で接続</td><td>多数のサーバを操作する管理者</td></tr>
<tr><td>SSHクライアント（PSM for SSH）</td><td>普段使うSSHクライアントからPSM for SSHへ接続</td><td>Linux管理者</td></tr>
<tr><td>Webアプリ・DBクライアント</td><td>PSM上でブラウザやSQLクライアントを起動して接続（接続コンポーネントで定義）</td><td>SaaS管理画面・DB管理者</td></tr>
</tbody></table></div>

<h2>4. PSM for SSH</h2>
<p>PSM for SSH（PSMP）は、SSH接続を中継・記録するLinux上のコンポーネントです。利用者は普段のSSHクライアントのまま、接続先の指定方法だけ変えます。</p>
<pre><code># 書式の例：&lt;Vaultユーザー&gt;@&lt;ターゲットのユーザー&gt;@&lt;ターゲットのアドレス&gt;@&lt;PSM for SSHのアドレス&gt;
ssh a.takahashi@root@hk-web01.hikari.example@hk-psmp01.hikari.example</code></pre>
<p class="small muted">公式ドキュメント（Connect through PSM for SSH）の書式は <code>ssh &lt;Vaultユーザー&gt;@&lt;ターゲットユーザー&gt;[#&lt;ドメイン&gt;]@&lt;ターゲットアドレス&gt;[#&lt;ポート&gt;]@&lt;PSM for SSHのアドレス&gt;</code> です。区切り文字（既定 <code>@</code>・<code>#</code>）は設定で変更でき、SSH鍵認証では <code>-i</code> を付けます。Privilege Cloudでは表記が少し異なるため、該当製品の手順を確認してください。</p>
<div class="callout key"><span class="ttl">SSHでは「コマンド」が記録される</span>
<p>PSM for SSHでは、入力したコマンドがテキストで記録されるため、「誰が・いつ・どのサーバで <code>rm -rf</code> を打ったか」を検索できます。危険なコマンドの実行を検知・制限する仕組みと組み合わせることもできます。</p>
</div>

<h2>5. 監視・録画の運用</h2>
<ul>
<li><strong>ライブ監視</strong>：監査担当は進行中のセッションを一覧で見て、画面を覗く（View）・操作に参加する（Control）ことができます（PVWAの <code>AllowMonitor</code>・<code>MonitoringLevel</code> 設定）。一時停止・強制終了は、既定では <code>PSMLiveSessionTerminators</code> グループのメンバーが行えます。</li>
<li><strong>録画の検索</strong>：アカウント、ターゲット、利用者、期間、入力コマンド等で録画を検索できます。</li>
<li><strong>保管容量</strong>：録画はデータ量が大きくなります。保持期間（Safeの保持設定）と容量を規程に合わせて設計します。</li>
<li><strong>PTA連携</strong>：危険な操作を検知したら自動で一時停止・終了する、といった連携が可能です（第12章）。</li>
</ul>

<h2>6. よくあるトラブル</h2>
<div class="table-wrap"><table>
<thead><tr><th>症状</th><th>疑うポイント</th></tr></thead>
<tbody>
<tr><td>Connectを押しても何も起きない／RDPがつながらない</td><td>利用者PC→PSMの3389（またはHTML5 GatewayのHTTPS）がFWで遮断、ロードバランサ設定</td></tr>
<tr><td>PSMには入れるがターゲットに接続できない</td><td>PSM→ターゲットの通信、ターゲット側のRDP/NLA設定、アカウントのパスワード不一致（→第8章のVerify/Reconcile）</td></tr>
<tr><td>全員が突然接続できなくなった</td><td>PSMConnect／PSMAdminConnectのパスワード期限切れ・ロック、PSMサービス停止、証明書期限切れ</td></tr>
<tr><td>特定の接続方式だけ起動しない</td><td>接続コンポーネントの設定、PSMサーバのアプリケーション実行制限（AppLocker等）で対象プログラムが許可されていない</td></tr>
<tr><td>録画が再生できない</td><td>録画のアップロード失敗（PSM一時領域の容量不足、Vaultとの通信）</td></tr>
</tbody></table></div>

<h2 id="dual">Self-Hosted と Privilege Cloud の違い（この章のポイント）</h2>
<div class="dual">
<div class="sh"><h4>🏢 Self-Hosted の場合</h4><ul><li>PSM／PSM for SSHを自社で構築。PSMConnect・PSMAdminConnectの管理も自社</li><li>ライブセッションの一時停止・終了は既定で PSMLiveSessionTerminators グループ</li></ul></div>
<div class="pc"><h4>☁ Privilege Cloud の場合</h4><ul><li>PSMはコネクタ上、SSHはPSM for SSH（Unixコネクタ）で中継</li><li><strong>RDP・SSH・データベース接続はSIAの利用が推奨</strong>（軽量なコネクタ、高可用性・負荷分散を内蔵、アップグレード時の停止がほぼない）。Vaultに格納したアカウントでの接続にもSIAを使える</li><li>Webサイト・クラウドコンソール・ESX/vCenter・ファットクライアントへの接続や、高度なカスタマイズが必要な場合は <strong>PSM</strong> を使う</li><li>ライブ監視は Administrators または Auditors ロールが必要</li></ul></div>
</div>
<p class="small muted">出典（2026-10-19確認）：Set up target access for privileged sessions、Manage PSM and PSM for SSH connectors、Monitor sessions、Active session monitoring in PSM</p>

<div class="ch-hero">
  <div class="eyebrow">CHAPTER 11｜利用・監視</div>
  <h1>認証・ユーザー管理・ID連携</h1>
  <p class="lead">金庫の鍵をいくら厳重に管理しても、「金庫室に入る人の本人確認」が甘ければ意味がありません。CyberArkへのログインの仕組みと、ユーザー・グループ管理の考え方を学びます。</p>
  <h4>この章の全体像</h4>
  <p class="small">ユーザーの種類 → 認証方式（Vault認証・LDAP・RADIUS・SAML・MFA）→ LDAP連携（Directory Mapping）→ Privilege Cloudでの認証（Identity）→ SAML認証の流れ → 設計の勘所</p>
  <h4>この章のゴール</h4>
  <ul class="goal-list">
    <li>CyberArkで使える主な認証方式と、MFAが必須である理由を説明できる</li>
    <li>ADグループとVault権限をつなぐ「LDAP連携」の仕組みを説明できる</li>
    <li>SAMLによるシングルサインオンの流れを説明できる</li>
  </ul>
  <div class="ch-meta"><span class="chip acc">目安 60分</span><span class="chip">前提：第6章</span></div>
</div>

<h2>1. ユーザーの種類</h2>
<div class="table-wrap"><table>
<thead><tr><th>種類</th><th>概要</th><th>例</th></tr></thead>
<tbody>
<tr><td>Vault（内部）ユーザー</td><td>Vault内に直接作成されるユーザー</td><td>組み込みユーザー、緊急用の管理者、コンポーネント用ユーザー</td></tr>
<tr><td>LDAPユーザー</td><td>Active Directory等のユーザーを連携して利用</td><td>一般の利用者・管理者（推奨）</td></tr>
<tr><td>コンポーネント・アプリ用ユーザー</td><td>CPM・PSM・CPなどがVaultへ接続するためのユーザー</td><td>人は使わない。自動で管理される</td></tr>
</tbody></table></div>
<div class="callout key"><span class="ttl">人の利用者は原則「LDAPユーザー＋MFA」</span>
<p>Vault内部ユーザーを大量に作ると、入退社・異動のたびに手作業が発生し、消し忘れが起きます。人はADなど既存のID基盤と連携し、Vault内部ユーザーは緊急用などに限定しましょう。</p>
</div>

<h2>2. 認証方式</h2>
<div class="table-wrap"><table>
<thead><tr><th>方式</th><th>概要</th><th>補足</th></tr></thead>
<tbody>
<tr><td>CyberArk（Vault）認証</td><td>Vaultに保存されたパスワードで認証</td><td>緊急用ユーザー等</td></tr>
<tr><td>LDAP認証</td><td>ADのID・パスワードで認証</td><td>単独ではMFAにならない</td></tr>
<tr><td>RADIUS</td><td>RADIUSサーバ経由でワンタイムパスワード等と組み合わせ</td><td>MFA製品との連携でよく使われる</td></tr>
<tr><td>PKI（証明書）</td><td>クライアント証明書・スマートカード</td><td>高セキュリティ環境</td></tr>
<tr><td><strong>SAML</strong></td><td>IdP（Identity・Entra ID・Okta等）で認証し、その結果でログイン</td><td>SSO＋IdP側のMFAを活用できる。現在の主流</td></tr>
</tbody></table></div>
<div class="callout analogy"><span class="ttl">MFAは「鍵＋顔認証」の二重ロック</span>
<p>パスワードだけの認証は「鍵だけの玄関」。鍵（パスワード）が盗まれたら誰でも入れます。MFAは「鍵＋顔認証（スマホ承認・生体認証）」です。金庫室の入口であるCyberArkには、<strong>必ずMFAを掛けます</strong>。</p>
</div>

<h2>3. LDAP連携（Directory Mapping）</h2>
<p>LDAP連携では、ADを「ユーザーの名簿」として使います。<strong>Directory Mapping</strong>（ディレクトリマッピング）の設定により、「ADのこのグループに所属する人は、Vaultでこういう権限・属性を持つ」というルールを定義します。</p>
<div class="table-wrap"><table>
<thead><tr><th>ADグループ（例）</th><th>CyberArkでの扱い</th></tr></thead>
<tbody>
<tr><td><code>GG_PAM_ADMINS</code></td><td>Vault Adminsにマッピング（管理機能）</td></tr>
<tr><td><code>GG_PAM_AUDITORS</code></td><td>Auditorsにマッピング（監査）</td></tr>
<tr><td><code>GG_PAM_INF_USERS</code> など</td><td>Safeメンバーとして直接登録（第6章）</td></tr>
</tbody></table></div>
<div class="callout tip"><span class="ttl">ADグループ運用のコツ</span>
<p>CyberArk用のADグループは命名規則（例：<code>GG_PAM_</code>で始める）を決め、<strong>グループのメンバー変更も申請・承認制</strong>にします。ADグループを変更できる人は実質的にCyberArkの権限を変更できるため、ADグループの管理権限自体が重要な統制ポイントになります。</p>
</div>

<h2>4. Privilege Cloudでの認証（Identity）</h2>
<p>Privilege Cloudでは、ISPSSの認証基盤である<strong>Identity</strong>（CyberArk Identity Security Platformのユーザー管理・認証機能）が入口になります。</p>
<ul>
<li>Identityで直接ユーザー管理・MFAを行う方法</li>
<li>社内IdP（Entra ID・Okta等）とSAMLで連携し、社内のSSOとMFAを使う方法</li>
<li>オンプレADのユーザー・グループを、Identity Connector経由で利用する方法</li>
</ul>
<p>どの方式を選ぶかは、既存のID基盤・MFA製品・社内ポリシーで決まります。</p>

<h2>5. SAML認証の流れ</h2>
<figure class="flow">
<div class="flow-head"><span class="flow-title">図11-1：SAMLによるシングルサインオン（概念図）</span></div>
<script class="dg" type="application/json">

<h2>6. 設計の勘所</h2>
<ul>
<li><strong>MFAは必須</strong>：特にVault管理者・Safe管理者・監査担当など権限の強い人から優先します。</li>
<li><strong>IdPが止まったときの手段</strong>：IdP障害でCyberArkに誰も入れないと、障害対応に必要な特権も使えません。<mark>緊急用の認証経路（ブレークグラス）</mark>を設計・文書化しておきます。</li>
<li><strong>退職・異動の自動反映</strong>：IdP・ADの無効化でCyberArkも使えなくなることを確認します。</li>
<li><strong>人の特権IDとログインIDの分離</strong>：普段のメール用IDとは別に、管理者用ID（例：<code>adm-a.takahashi</code>）を使う組織もあります。</li>
</ul>

<h2 id="dual">Self-Hosted と Privilege Cloud の違い（この章のポイント）</h2>
<div class="dual">
<div class="sh"><h4>🏢 Self-Hosted の場合</h4><ul><li>PVWAで認証方式（CyberArk・LDAP・RADIUS・SAML 等）を構成</li><li>LDAP連携はDirectory Mappingで定義</li></ul></div>
<div class="pc"><h4>☁ Privilege Cloud の場合</h4><ul><li>ログインの入口はISPSSの <strong>Identity</strong>（MFA・SSO、社内IdPとのSAML連携）</li><li>LDAP連携は <strong>Directory Map</strong> で定義（よく使う役割の既定マップあり）。LDAPS必須で、LDAPグループに属し有効なユーザーのみ連携される</li><li>Identityのロール（Privilege Cloud Administrators／Auditors／Safe Managers 等）は権限だけでなく<strong>消費するライセンス</strong>も決める</li></ul></div>
</div>
<p class="small muted">出典（2026-10-19確認）：LDAP integration（Privilege Cloud）、ISPSS user roles、Set up LDAP integration（Self-Hosted）</p>
