  <p class="lead">「使われたらすぐ気づく」を実現するのがこの章の領域です。不審な動きを自動で見つけるPTAと、監査・コンプライアンスのためのログ・レポートを学びます。</p>

<h2>1. PTA（Privileged Threat Analytics）の役割</h2>
<div class="callout analogy"><span class="ttl">防犯カメラの映像を見続けるAI警備員</span>
<p>録画（PSM）や入退室記録（Vaultの監査ログ）は、あとから見返すためのものです。PTAは、それらの記録や社内のログを<strong>リアルタイムで突き合わせ</strong>、「鍵を借りていないのに部屋に入った人がいる」「深夜にいつもと違う部屋を開けている」といった不審な動きを見つけて知らせ、必要なら自動で鍵を替えます。</p>
</div>
<div class="table-wrap"><table>
<thead><tr><th>入力データ（例）</th><th>何がわかるか</th></tr></thead>
<tbody>
<tr><td>Vaultの監査ログ</td><td>誰がいつどのアカウントを取り出した・使ったか</td></tr>
<tr><td>PSM／PSM for SSHのセッション情報</td><td>セッション中に何のコマンド・操作をしたか</td></tr>
<tr><td>ドメインコントローラ・サーバのログ（SIEM経由や専用の収集機構）</td><td>実際にどのアカウントでどこへログオンしたか</td></tr>
</tbody></table></div>

<h2>2. 主な検知の種類</h2>
<div class="table-wrap"><table>
<thead><tr><th>検知</th><th>考え方</th><th>例</th></tr></thead>
<tbody>
<tr><td><strong>資格情報窃取の疑い</strong></td><td>Vaultから取り出されていないのに、管理対象の特権アカウントでログオンがあった</td><td>Pass-the-Hash等で盗んだ資格情報の利用</td></tr>
<tr><td><strong>管理外の特権アクセス</strong></td><td>CyberArkに登録されていない特権アカウントが使われた</td><td>誰かが勝手に作った管理者アカウント</td></tr>
<tr><td><strong>危険なセッション操作</strong></td><td>セッション中に登録された危険なコマンド・操作が行われた</td><td>監査ログ削除、ユーザー追加、全データ削除コマンド</td></tr>
<tr><td><strong>振る舞いの異常</strong></td><td>普段の利用パターン（時間帯・頻度・対象）から外れた利用</td><td>深夜に大量のアカウントを取り出す</td></tr>
<tr><td>Kerberos関連攻撃などの兆候</td><td>認証プロトコルの不正な使い方を検出</td><td>※対応範囲は製品バージョン・構成により異なる</td></tr>
</tbody></table></div>

{"from":"pta","to":"cpm","label":"⑤PW変更指示","lx":10,"ly":18,"s":[5]}]}
</script>
<ol class="flow-desc">
<li data-label="不審なログオン">何者かが、Vaultを通さずに <code>hk-fs01</code> のAdministratorで直接ログオンしました（盗んだパスワードやハッシュを使った可能性）。</li>
<li data-label="ログの収集">サーバやドメインコントローラのログオン記録が、PTAへ送られます。</li>
<li data-label="Vaultと突き合わせ">PTAは「そのアカウントがその時刻の前にVaultから取り出されたか」を確認します。<strong>取り出し記録がない＝正規の手順を通っていない</strong>ため、資格情報窃取の疑いと判定します。</li>
<li data-label="アラート">PTAのダッシュボードに表示し、SIEMやメールでSOC（セキュリティ監視チーム）へ通知します。</li>
<li data-label="自動対応">設定に応じて、PTAがCPMにパスワード変更を指示します。盗まれた資格情報はその時点で使えなくなります。</li>
<li data-label="調査・封じ込め">SOCはログ・録画・PTAの情報をもとに、侵入経路や影響範囲を調査します（ケーススタディ応用編で演習）。</li>
</ol>
</figure>
<div class="callout key"><span class="ttl">PTAの精度は「CyberArk経由の利用率」で決まる</span>
<p>普段から管理者がVaultを通さずにログオンしている環境では、正規の作業まで「窃取の疑い」として大量に検知され、本物のアラートが埋もれます。<strong>「特権作業は必ずCyberArk経由」を徹底すること</strong>が、検知を有効にする前提です。</p>
</div>
<div class="callout verify"><span class="ttl">提供形態による違い</span><p>Self-HostedではPTAを専用サーバとして構築します。SaaS環境で同等の脅威分析を行う機能・ライセンスの構成は時期により変わっているため、Privilege Cloud環境では最新の公式ドキュメントで提供機能を確認してください。</p></div>

<h2>4. 監査ログ・レポート</h2>
<div class="table-wrap"><table>
<thead><tr><th>種類</th><th>中身</th><th>使う場面</th></tr></thead>
<tbody>
<tr><td>監査ログ（Activity）</td><td>ログイン、アカウントの取り出し・使用、承認、設定変更などの全操作</td><td>「誰がいつ何をしたか」の調査</td></tr>
<tr><td>セッション録画・操作ログ</td><td>PSM経由のセッションの映像・コマンド・キーストローク</td><td>「その作業で具体的に何をしたか」の確認</td></tr>
<tr><td>アカウント棚卸しレポート</td><td>管理下のアカウント一覧、最終変更日、CPMの状態</td><td>定期棚卸し、未変更・エラーアカウントの発見</td></tr>
<tr><td>Safe・権限レポート</td><td>Safeごとのメンバーと権限</td><td>権限の定期レビュー（アクセス権の棚卸し）</td></tr>
<tr><td>コンプライアンスレポート</td><td>ポリシー遵守状況（変更間隔超過など）</td><td>監査報告、経営報告</td></tr>
</tbody></table></div>

<h2>5. SIEM連携</h2>
<p>VaultやPTAのイベントは、Syslogで社内のSIEMに送ることができます。SIEM側で他のログ（FW・EDR・AD）と相関分析することで、攻撃の全体像を追いやすくなります。Self-HostedのVaultでは、送信するイベントの形式を変換定義（XSL）で指定し、SIEMが読みやすい形式（CEFなど）で送る構成が一般的です。</p>
<div class="callout tip"><span class="ttl">SIEMで最低限見ておきたいイベント（例）</span>
<ul>
<li>Masterユーザー・Administratorユーザーのログイン</li>
<li>Safeメンバーの追加・権限変更（特に自分自身への付与）</li>
<li>Master Policy・プラットフォームの変更</li>
<li>短時間に大量のアカウント取り出し</li>
<li>PTAの高リスクアラート</li>
</ul>
</div>

<h2>6. 監査対応の勘所</h2>
<ul>
<li><strong>「申請→承認→利用→録画」が1本の線でつながること</strong>を示せるようにします（チケット番号を「理由」に入れる運用が効きます）。</li>
<li><strong>定期レビュー</strong>：Safe権限（四半期）、管理対象外アカウントの有無、CPMエラーの放置がないかを定期的に確認します。</li>
<li><strong>ログ・録画の保持期間</strong>は社内規程・法令（業界基準）に合わせ、容量計画とセットで決めます。</li>
</ul>

<h2 id="dual">Self-Hosted と Privilege Cloud の違い（この章のポイント）</h2>
<div class="dual">
<div class="sh"><h4>🏢 Self-Hosted の場合</h4><ul><li>PTAを専用サーバとして構築</li><li>VaultからSyslog（変換定義XSL）でSIEMへ送信</li></ul></div>
<div class="pc"><h4>☁ Privilege Cloud の場合</h4><ul><li>監査イベントはISPSS共通の <strong>Audit service</strong> に集約され、他のSaaSサービスの記録と合わせて確認・CSV出力できる</li><li>SIEM連携はSyslog：TLS推奨（TCPも可、<strong>UDP非対応</strong>）、最大5台。Secure Tunnel経由の構成が案内されている（エージェント不要の新方式も追加されているため、テナントで確認）</li><li>脅威検知は <strong>Threat Detection and Response（ITDR）</strong>：SIEMからログオンイベントを取り込み、資格情報窃取や管理外の特権アカウントを検知</li></ul></div>
</div>
<p class="small muted">出典（2026-10-19確認）：Connect to SIEM（Privilege Cloud）、Privilege Cloud audit events、Detect, monitor, and respond to threats</p>

<h2>1. ハードコードの問題</h2>
<p>開発チームの中村さんのアプリは、設定ファイルに次のように書かれていました（架空の例）。</p>
<pre><code># /opt/hk-sales/config/db.properties
db.url=jdbc:oracle:thin:@hk-db01.hikari.example:1521/SALES
db.user=appuser
db.password=Hikari2019!   ← 平文のまま、7年間変更なし</code></pre>
<div class="callout danger"><span class="ttl">直書き（ハードコード）が危険な理由</span>
<ul>
<li>サーバに入れた人・ソースコードを見た人なら誰でもパスワードを知ることができる</li>
<li>Git等のリポジトリやバックアップ、チャットに貼られて拡散する</li>
<li>変更するとアプリが止まるため、<strong>何年も変更されない</strong></li>
<li>同じパスワードが複数環境で使い回されがち</li>
</ul>
</div>

<h3>「シークレット・ゼロ」問題</h3>
<div class="callout analogy"><span class="ttl">金庫の鍵を、どこにしまうか</span>
<p>「パスワードは金庫（Vault）に入れました。アプリは金庫から取り出します」——では、<strong>アプリが金庫を開けるための鍵</strong>はどこに置くのでしょうか？それを設定ファイルに書いたら元の木阿弥です。この「最初の1つの秘密」をどう扱うかが<strong>シークレット・ゼロ問題</strong>です。CyberArkは、<strong>パスワードの代わりに「アプリ自身の属性」（どのマシンで、どのOSユーザーで、どのプログラムが動いているか、証明書、クラウドやKubernetesが発行するID）</strong>で本人確認することで、この問題を解決します。</p>
</div>

<h2>2. Credential Provider（CP）とCentral Credential Provider（CCP）</h2>
<div class="table-wrap"><table>
<thead><tr><th>項目</th><th>CP（Credential Provider）</th><th>CCP（Central Credential Provider）</th></tr></thead>
<tbody>
<tr><td>形態</td><td>アプリサーバに<strong>エージェントを導入</strong></td><td><strong>エージェント不要</strong>。中央のWebサービスにREST等で問い合わせ</td></tr>
<tr><td>可用性</td><td>ローカルキャッシュを持ち、Vaultに一時的に接続できなくても取得可能</td><td>CCPサーバの冗長化（複数台＋ロードバランサ）で確保</td></tr>
<tr><td>アプリ認証</td><td>OSユーザー、実行パス、ハッシュ、許可マシン等</td><td>許可マシン（送信元IP）、クライアント証明書等</td></tr>
<tr><td>向いている場面</td><td>エージェントを入れられるサーバ、高い可用性が必要</td><td>エージェントを入れられない機器・アプライアンス・外部製品との連携（RPA等）</td></tr>
</tbody></table></div>
<p>アプリケーションサーバのデータソース（接続プール）向けに、アプリのコードを変えずに資格情報を提供する仕組み（ASCP）もあります。</p>

<h3>アプリをVaultに登録する（Application ID）</h3>
<ol>
<li>PVWAでアプリケーションを登録し、<strong>Application ID</strong>（例：<code>HK-SalesApp</code>）を決める</li>
<li>アプリ認証の条件を設定する（許可マシン <code>10.30.1.21</code>、クライアント証明書、OSユーザー等）</li>
<li>アプリ用Safe（<code>HK-PRD-APP-ORA-APPUSR</code>）に、アプリ（Application ID）と、CP/CCPのProviderをメンバーとして追加する（主に<strong>List accounts と Retrieve accounts</strong>。Providerにはさらに View Safe members 等が必要）</li>
<li>人のメンバーにはRetrieveを付けない（人は見られない設計にする）</li>
</ol>

<figure class="flow">
<div class="flow-head"><span class="flow-title">図13-1：アプリがCCP経由でDBパスワードを取得する</span></div>

<h2>4. Secrets Manager（旧 Conjur）</h2>
<p>コンテナ、Kubernetes、CI/CDパイプラインなど、<strong>短時間で大量に生まれては消えるワークロード</strong>向けのシークレット管理です。SaaS版とSelf-Hosted版があります。</p>
<ul>
<li><strong>ポリシー・アズ・コード</strong>：誰（どのワークロード）がどのシークレットを使えるかを、コード（YAML等）で定義・レビューできる</li>
<li><strong>プラットフォームのIDで認証</strong>：Kubernetesのサービスアカウント、クラウドのIAMロール、JWTなどを使い、シークレット・ゼロ問題を解消</li>
<li><strong>PAMとの同期</strong>：VaultのSafeに入っているアカウントを同期して、CPMによる自動変更の恩恵を受けられる構成がある</li>
</ul>

<h2>5. Secrets Hub</h2>
<div class="callout analogy"><span class="ttl">本社の金庫と各支店の金庫</span>
<p>AWS Secrets ManagerやAzure Key Vaultは「各クラウドに備え付けの金庫（支店の金庫）」です。開発者は使い慣れたその金庫を使いたい。一方セキュリティ部門は、ローテーションや監査を本社（CyberArk）で一元管理したい。Secrets Hubは、<strong>本社金庫の中身を支店金庫に自動で配送・同期する仕組み</strong>です。</p>
</div>
<ul>
<li>CyberArk（Privilege Cloud／Self-Hosted）で管理・ローテーションしたシークレットを、<strong>AWS Secrets Manager・Azure Key Vault・GCP Secret Manager・HashiCorp Vault</strong>へ同期（公式「Secrets Hub support and scope」2026-10-19確認。鍵・証明書は対象外）</li>
<li>各クラウドとの信頼関係は、AWSはIAMロール、AzureはApp Registration（新規はフェデレーションIDのみ）、GCPはサービスアカウント／Workload Identity Federationで構成</li>
<li>アプリは<strong>クラウドの標準API</strong>のまま使えるため、アプリ改修が少ない</li>
<li>クラウドのシークレットストアにある既存シークレットを発見・可視化し、CyberArkの管理下へ取り込む機能も拡充されている（2025年のアップデート）</li>
</ul>

<h2>6. 使い分け</h2>
<div class="table-wrap"><table>
<thead><tr><th>アプリの種類</th><th>第一候補</th><th>理由</th></tr></thead>
<tbody>
<tr><td>オンプレの従来型業務アプリ（エージェント導入可）</td><td>CP</td><td>ローカルキャッシュで高可用</td></tr>
<tr><td>アプライアンス・パッケージ製品・RPA</td><td>CCP</td><td>エージェント不要、製品側の連携機能が対応していることが多い</td></tr>
<tr><td>Kubernetes・コンテナ・CI/CD</td><td>Secrets Manager</td><td>ワークロードIDで認証、ポリシー・アズ・コード</td></tr>
<tr><td>クラウドネイティブアプリ（AWS/Azure等の標準ストアを利用）</td><td>Secrets Hub</td><td>アプリ改修を最小にしつつ一元管理</td></tr>
</tbody></table></div>

<h2 id="dual">Self-Hosted と Privilege Cloud の違い（この章のポイント）</h2>
<div class="dual">
<div class="sh"><h4>🏢 Self-Hosted の場合</h4><ul><li>CP／CCPは自社のVaultに接続</li><li>Secrets HubはSelf-HostedのPAMをソースとして利用可能</li></ul></div>
<div class="pc"><h4>☁ Privilege Cloud の場合</h4><ul><li>CP／CCPはPrivilege Cloudでも利用可能（アプリ認証・Safe権限の考え方は同じ）</li><li>Secrets HubはPrivilege Cloudをソースとして利用可能</li><li>パスワード変更をSecrets Rotation Serviceで行う場合、Credential Providerの dual account 管理は未対応（設計時に注意）</li></ul></div>
</div>

  <p class="lead">「強い権限を持ったアカウントを金庫で守る」から一歩進んで、「そもそも強い権限を常に持たせておかない」へ。クラウド時代の特権アクセスの考え方と、それを実現する製品を学びます。</p>
  <h4>この章の全体像</h4>

<h2>1. 常設特権・JIT・ZSP</h2>
<div class="callout analogy"><span class="ttl">会議室の使い方で考える</span>
<p><strong>常設特権</strong>：あなた専用の会議室の合鍵を常に持っている。使っていない夜中でも、鍵を落とせば誰でも入れる。<br>
<strong>JIT（ジャストインタイム）</strong>：会議の時間だけ受付で鍵を借りる。ただし借りた鍵は全会議室共通のマスターキーかもしれない。<br>
<strong>ZSP（ゼロ・スタンディング特権）</strong>：会議のたびに「その部屋の、その時間だけ開く」専用の鍵がその場で作られ、終わったら消える。普段は誰も鍵を持っていない。</p>
</div>
<div class="table-wrap"><table>
<thead><tr><th>方式</th><th>権限を持っている時間</th><th>権限の範囲</th><th>盗まれたときの被害</th></tr></thead>
<tbody>
<tr><td>常設特権</td><td>常に</td><td>広いことが多い</td><td>最大</td></tr>
<tr><td>JIT</td><td>必要なときだけ</td><td>あらかじめ用意された権限（広い場合もある）</td><td>時間的に限定</td></tr>
<tr><td><strong>ZSP</strong></td><td>セッションの間だけ</td><td>そのタスクに必要な最小限（その場で作成・終了後に削除）</td><td>時間的にも範囲的にも限定</td></tr>
</tbody></table></div>
<div class="point-box">
  <div class="big">⏱</div>
  <div><p class="one">ZSP＝「必要なときに・必要なだけ・必要な間だけ」。終わったら権限そのものが消える。</p>
  <p class="small muted">攻撃者が狙う「放置された強い権限」そのものをなくすのが狙いです。</p></div>
</div>

<h2>2. Secure Infrastructure Access（SIA）</h2>
<p>SIA（2024年10月に Dynamic Privileged Access から改称。改称時に、ZSPに加えてVaultに格納した資格情報での接続にも対応）は、Windows／Linuxサーバ、データベース、Kubernetesなどへの特権アクセスを、<strong>JIT・ZSPの考え方で提供するSaaS</strong>です。</p>
<ul>
<li><strong>VPN・踏み台が不要</strong>：顧客ネットワーク内のコネクタが外向きに接続する方式で、インバウンドの穴を開けずに利用できる</li>
<li><strong>一時的な資格情報</strong>：セッションごとに短命な資格情報（一時的なユーザー・証明書など）を用意し、終了後に無効化</li>
<li><strong>ネイティブクライアント</strong>：利用者は普段のSSHクライアント・RDPクライアント・DBクライアントで接続できる</li>
<li><strong>属性ベースのポリシー</strong>：クラウドのタグやネットワーク範囲などの属性で「誰が・どこに・いつ」アクセスできるかを定義</li>
<li><strong>セッションの記録・監査</strong>：プラットフォーム共通の監査に記録</li>
</ul>

<h2>3. Secure Cloud Access（SCA）</h2>
<p>SCAは、AWS・Azure・GCPなどの<strong>クラウド管理コンソールやCLIへの特権</strong>を、必要な時間だけ付与するSaaSです。</p>
<ul>
<li>常設の強いクラウドロール（管理者ロール等）を利用者に割り当てておかない</li>
<li>利用者は必要なときに申請し、ポリシー（必要なら承認）に基づいて期間限定でロールが付与される</li>
<li>期間が終わると自動で剥奪される</li>
</ul>

<h2>4. Endpoint Privilege Manager（EPM）</h2>
<div class="callout analogy"><span class="ttl">社用車の「スペアキー」を全員に配らない</span>
<p>PCのローカル管理者権限は、社員全員に社用車のスペアキーを配るようなものです。便利ですが、マルウェアも同じ権限で動けてしまいます。EPMはスペアキーを回収し、「このアプリのインストールだけ」「この設定変更だけ」をその場で許可します。</p>
</div>
<div class="table-wrap"><table>
<thead><tr><th>機能</th><th>内容</th></tr></thead>
<tbody>
<tr><td>最小権限（特権の除去と昇格）</td><td>ローカル管理者権限を取り除き、ポリシーで許可したアプリ・操作だけ昇格させる。必要に応じて申請→一時的な昇格（JIT）</td></tr>
<tr><td>アプリケーション制御</td><td>許可・ブロック・制限付き実行など、アプリごとに実行を制御</td></tr>
<tr><td>資格情報窃取対策</td><td>OSやブラウザ等に保存された資格情報を狙う窃取の試みを検知・ブロック</td></tr>
<tr><td>ランサムウェア対策</td><td>不審なファイル暗号化等の振る舞いからの保護</td></tr>
</tbody></table></div>
<p class="small muted">EPMは現在SaaSで提供され、Windows・macOS・Linuxに対応しています（対応OSは公式ドキュメントで確認）。公式のEnd of Life Policyによると、オンプレミス版は2021年1月6日に段階的終了が告知され、<strong>2023年12月31日でサポートが終了</strong>しています（2026-10-19確認）。</p>

<h2>5. Remote Access（委託先アクセス）</h2>
<ul>
<li>保守委託先（例：ネクスト保守サービスの小林さん）が、<strong>VPNなし</strong>で必要なシステムにだけアクセスできる</li>
<li>委託先の担当者ごとにADアカウントやVPNアカウントを作らずに済む（JITでの登録）</li>
<li>モバイルアプリ（旧Aleroアプリ。現在はIdira Mobileアプリ）でワンタイムのQRコードを読み取り、顔・指紋認証で本人確認（生体情報はスマートフォン内に留まる）。Remote Accessは2021年にAleroから改称</li>
<li>アクセスはPSM等を経由するため、パスワードは渡さず、操作は録画される</li>
</ul>

<h2>6. Vault型PAMとZSP型をどう組み合わせるか</h2>
<div class="table-wrap"><table>
<thead><tr><th>対象</th><th>向いている方式</th><th>理由</th></tr></thead>
<tbody>
<tr><td>ネットワーク機器、古いOS、パッケージ製品の管理者</td><td>Vault型（PAM＋CPM＋PSM）</td><td>一時ユーザーを作れない・固定の管理者アカウントが必要なものが多い</td></tr>
<tr><td>緊急用アカウント（ブレークグラス）、ドメイン管理者</td><td>Vault型（厳格なワークフロー）</td><td>どうしても常設が必要なものは金庫で守る</td></tr>
<tr><td>クラウド上のLinux/Windows、DB、Kubernetes</td><td>ZSP型（SIA）</td><td>動的に増減し、属性で制御しやすい</td></tr>
<tr><td>クラウド管理コンソール</td><td>ZSP/JIT型（SCA）</td><td>ロールの一時付与で常設特権をなくせる</td></tr>
<tr><td>社員PCのローカル管理者</td><td>EPM</td><td>端末の権限そのものを最小化</td></tr>
</tbody></table></div>
<div class="callout key"><span class="ttl">「どちらか」ではなく「両方」</span>
<p>現実の企業には古いシステムとクラウドが混在します。<strong>常設が避けられないものはVaultで守り、なくせる常設特権はZSPでなくす</strong>——これが現在の設計の主流の考え方です。</p>
</div>

<h2>2. 段階導入（ロードマップ）</h2>
<p>CyberArkは、リスクの高いものから順に導入していく段階的なアプローチ（CyberArk Blueprint for Identity Security Success など）を公開しています。考え方の例を示します。</p>
<div class="table-wrap"><table>
<thead><tr><th>段階</th><th>目的</th><th>主な対象・施策（例）</th></tr></thead>
<tbody>
<tr><td>段階1</td><td><strong>資格情報の窃取を防ぐ</strong></td><td>ドメイン管理者などの最重要アカウントをVaultに格納・自動変更・PSM経由に限定。緊急用アカウントの統制</td></tr>
<tr><td>段階2</td><td><strong>横展開・権限昇格を止める</strong></td><td>サーバのローカル管理者、DB・ネットワーク機器の管理者、ワークステーションの権限（EPM）へ拡大</td></tr>
<tr><td>段階3</td><td><strong>特権の悪用を最小化する</strong></td><td>アプリのシークレット、クラウド、ZSP/JITの適用、脅威検知と自動対応の高度化</td></tr>
</tbody></table></div>
<div class="callout verify"><span class="ttl">参考</span><p>公式ドキュメントのBlueprint（docs.cyberark.com の「CyberArk Blueprint」）では、侵入後の攻撃に対する3つの原則として「アイデンティティ侵害（資格情報窃取）の防止」「横方向・縦方向の移動の阻止」「権限昇格と悪用の制限」を挙げており、上表はこれを新人向けに要約したものです（2026-10-19確認）。各原則に対応する具体的な統制（Vault格納・ローテーション・分離、JIT・一意のローカル資格情報、最小権限・ZSP・脅威検知など）は同ドキュメントを参照してください。</p></div>
<div class="callout tip"><span class="ttl">最初の成果（クイックウィン）を早く出す</span>
<p>導入プロジェクトは長期化しがちです。「ドメイン管理者を全部Vaultに入れ、パスワードを自動変更した」のような<strong>経営層にも伝わる最初の成果</strong>を早めに作ると、その後の展開がスムーズになります。</p>
</div>

  <p class="small muted">「全員が使えない」なら共通部分（Vault・PSMサービス・証明書・内部アカウント・ネットワーク）、「1アカウントだけ」ならそのアカウントの設定・ターゲットを疑います。</p></div>

<h2>6. 自動化（REST API）</h2>
<p>PVWA（Privilege CloudではそのAPI）はREST APIを提供しており、Safe作成・アカウント登録・権限付与などを自動化できます。サーバ構築の自動化（IaC）と連動して「構築したらすぐCyberArkに登録」を実現できます。</p>
<pre><code># 例：Self-Hosted PVWA の REST API（概念例。実際のエンドポイント・認証方式はバージョンの公式APIリファレンスで確認）
# 1) ログオン（トークン取得）
POST https://pam.hikari.example/PasswordVault/API/auth/CyberArk/Logon
# 2) アカウント登録
POST https://pam.hikari.example/PasswordVault/API/Accounts
{
  "safeName": "HK-PRD-INF-LNX-ROOT",
  "platformId": "HK-Unix-SSH-Root",
  "address": "hk-web03.hikari.example",
  "userName": "root",
  "secretType": "password",
  "secret": "（初期パスワード）"
}</code></pre>
<div class="callout danger"><span class="ttl">自動化用の資格情報こそ守る</span>
<p>API用のユーザーは強い権限を持ちがちです。権限は必要最小限にし、その資格情報自体もCyberArk（CP/CCP等）から取得するようにします。PowerShell向けのコミュニティモジュール（psPAS）や、Ansibleの公式コレクションなども活用されています。</p>
</div>

<h2>7. バージョンアップとサポート</h2>
<ul>
<li><strong>Self-Hosted</strong>：サポート期間の区分（長期サポートのLTS、標準のSTS。LTSと明記されていない版はSTS）があります。公式のEnd of Life Policy（2026-10-19確認）では次のとおりです。
<div class="table-wrap"><table><thead><tr><th>バージョン</th><th>リリース</th><th>開発終了（修正提供の終了）</th><th>サポート終了</th></tr></thead><tbody>
<tr><td><strong>15.2（LTS）</strong></td><td>2026年7月</td><td>2029年7月</td><td>2029年7月（有償延長で2031年7月）</td></tr>
<tr><td>15.0（STS）</td><td>2025年12月</td><td>2026年12月</td><td>2027年12月</td></tr>
<tr><td>14.6（LTS）</td><td>2025年6月</td><td>2028年6月</td><td>2028年6月（有償延長で2030年6月）</td></tr>
</tbody></table></div>
<strong>アップグレードはLTSから次のLTS、または最新版へのみサポート</strong>され、LTSの修正を受けるには全コンポーネントを同じLTSにそろえる必要があります。15.2ではIdiraブランドへの名称変更も始まっています。</li>
<li><strong>アップグレード順序</strong>：公式の互換性ページでは <strong>Vault → PVWA → CPM</strong> の順に上げ、その後に他のコンポーネント（PSM等）を上げるとされています（例：CPM 15.2 は Vault・PVWA が15.2以上であることが前提）。Primary-DR構成では<strong>Primary Vault → DR Vault → コンポーネント</strong>の順です。<mark>組み合わせによって条件が異なる</mark>ため、作業前に必ず該当バージョンのアップグレードガイドと互換性表を確認します。</li>
<li><strong>Privilege Cloud</strong>：SaaS側は自動で更新されます。コネクタ側のコンポーネント（CPM・PSM等）は、更新の仕組みと対応バージョンを確認して計画的に更新します。</li>
</ul>

<h2 id="dual">Self-Hosted と Privilege Cloud の違い（この章のポイント）</h2>
<div class="dual">
<div class="sh"><h4>🏢 Self-Hosted の場合</h4><ul><li>LTS／STSのライフサイクルに合わせて計画的にアップグレード（LTS→LTS または最新版のみ）</li><li>順序は Vault → PVWA → CPM → その他（Primary → DR → コンポーネント）</li></ul></div>
<div class="pc"><h4>☁ Privilege Cloud の場合</h4><ul><li>SaaS側（Vault・ポータル・SRS 等）は提供側が更新</li><li>コネクタ側は、Connector Management画面に新しいバージョンが表示されたら <strong>管理者が更新を実行</strong>（自動では更新されない）。CPM・PSMの更新は数分の停止を伴い、先にGPO堅牢化パッケージを更新する</li><li>コネクタはバックエンドのバージョンに関係なくいつでも更新できる</li><li>日常運用ではConnector Managementでコネクタの状態、送信元IP・証明書の期限などを確認</li></ul></div>
</div>
<p class="small muted">出典（2026-10-19確認）：EOL Policy、Component compatibility、Upgrade the Privilege Cloud components using Connector Management</p>

<ul class="checklist" data-key="lab2">
<li>命名規則に沿ってSafe <code>LAB-STG-INF-LNX-XX</code> を作成し、説明欄にオーナー（自分の名前）を記入した</li>
<li>担当CPMとして <code>lab-cpm01</code> が割り当てられていることを確認した</li>
<li>自分の演習用ADグループ <code>GG_LAB_USERS_XX</code> に <strong>List＋Use</strong> だけを付与した</li>
<li>講師（承認者役）を <strong>List＋Authorize account requests</strong> で追加した</li>
<li>メンバー追加の操作が監査ログに残っていることを確認した</li>
</ul>
<div class="callout tip"><span class="ttl">振り返り</span><p>自分自身に Retrieve や Manage Safe members を付けたくなったら、それは職務分掌（SoD）違反のサインです。講師に理由を説明できるか考えましょう。</p></div>
</section>

<!-- 演習3 -->
<section class="lab">
<h3>演習3：Linuxアカウントの登録・検証・変更（60分）</h3>
<p><strong>目的：</strong>Logon Account付きでrootに相当するアカウントを登録し、CPMで管理下に入れる（第7・8章）。</p>
<ul class="checklist" data-key="lab3">
<li><code>labops-XX</code>（Logon Account）を先に登録した</li>
<li><code>labroot-XX</code> を、講師指定のLinux用プラットフォーム（例：<code>LAB-Unix-SSH</code>）とSafe <code>LAB-STG-INF-LNX-XX</code> を指定して登録した</li>
<li><code>labroot-XX</code> に Logon Account（<code>labops-XX</code>）と Reconcile Account（<code>svc_lab_reconcile</code>）を関連付けた</li>
<li>Verify（検証）を実行して成功した</li>
<li>Change（変更）を実行し、成功した。旧パスワードで直接SSHできなくなったことを講師と確認した</li>
<li>アカウントの履歴（バージョン）に変更が記録されていることを確認した</li>
</ul>
</section>

<!-- 演習4 -->
<section class="lab">
<h3>演習4：PSM経由の接続と録画の確認（45分）</h3>
<p><strong>目的：</strong>パスワードを見ずに接続し、自分の操作を録画から探す（第10章）。</p>
<ul class="checklist" data-key="lab4">
<li>PVWAから <code>labroot-XX</code> で「Connect」し、パスワードを見ずに lab-lnx01 にログインできた</li>
<li>セッション内で <code>hostname</code>、<code>id</code>、<code>ls /etc</code> を実行してから切断した</li>
<li>SSHクライアントから PSM for SSH 経由でも接続できた（書式は講師が配布する手順に従う）</li>
<li>録画一覧から自分のセッションを探し、再生できた</li>
<li>操作ログ（コマンド）で <code>id</code> を検索し、録画の該当箇所へジャンプできた</li>
</ul>
</section>

<!-- 演習5 -->
<section class="lab">
<h3>演習5：二重承認ワークフロー（2人1組・40分）</h3>
<p><strong>目的：</strong>申請者・承認者の両方を体験する（第9章）。講師が演習用プラットフォームに二重承認の例外を設定済みとします。</p>
<ul class="checklist" data-key="lab5">
<li>申請者として、理由（例：<code>LAB-CHG-0001</code>）と時間帯を入力して利用申請した</li>
<li>承認前は接続できないことを確認した</li>
<li>承認者役として、相手の申請内容を確認して承認（または理由を付けて却下）した</li>
<li>承認後に接続でき、申請・承認・接続が監査ログで1本の線としてつながっていることを確認した</li>
</ul>
</section>

<section class="lab">
<h3>演習7：CPMエラーの切り分け（45分）</h3>
<p><strong>目的：</strong>エラーの「段階」を見極める（第8章）。講師が次のいずれかの障害を仕込みます。受講者は原因を当ててください。</p>
<div class="table-wrap"><table>

<tr><td>A：lab-lnx01 側でSSHを一時停止</td><td>接続段階のエラー（タイムアウト・接続拒否）</td></tr>

<p><strong>目的：</strong>自動化の入口を体験する（第15章）。エンドポイント・認証方式はバージョンの公式APIリファレンスで確認してください。</p>
<pre><code># PowerShell の例（検証環境・概念例）

$cred = Get-Credential   # 自分の検証用ID（パスワードをスクリプトに書かない）
$body = @{ username = $cred.UserName; password = $cred.GetNetworkCredential().Password } | ConvertTo-Json
$token = Invoke-RestMethod -Method Post -Uri "$base/API/auth/LDAP/Logon" -Body $body -ContentType "application/json"

<script type="text/plain" id="js-quiz">
(function () {
  "use strict";
  var BANK = window.QUIZ_BANK || [];
  var CH = window.CA_SITE.chapters;
  var S = window.CA_STORE;
  var MK = "ABCD";
  var $ = function (id) { return document.getElementById(id); };
  var state = null;

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  // 前回と同じ出題順にならないよう、同一順序なら引き直す
  function shuffleAvoidRepeat(list, key) {
    var prev = S.get(key, "");
    var out, sig, tries = 0;
    do { out = shuffle(list); sig = out.map(function (x) { return x.id; }).join(","); tries++; } while (sig === prev && list.length > 1 && tries < 10);
    S.set(key, sig);
    return out;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  BANK.forEach(function (q, i) { q.id = i; });

  function pool() {
    var r = $("q-range").value, lv = $("q-level").value, p = r === "all" ? [1, 99] : r.split("-").map(Number);
    return BANK.filter(function (q) { return q.c >= p[0] && q.c <= p[1] && (lv === "all" || String(q.d) === lv); });
  }
  function info() {
    var n = pool().length;
    $("bank-info").textContent = "この範囲の問題数：" + n + "問（問題数がこれより多い設定の場合は全問を出題）";
    var b = S.get("ca-quiz-best", null);
    $("best").innerHTML = (b === null ? "" : "これまでの自己ベスト（全章・全難易度・20問以上）：" + b + "%　") + '<a href="report.html">学習記録・提出</a>';
  }
  $("q-range").addEventListener("change", info);
  $("q-level").addEventListener("change", info);
  info();

  function start(list) {
    var qs = shuffleAvoidRepeat(list, "ca-quiz-lastorder").map(function (q) {
      var opts = q.a.map(function (t, i) { return { t: t, ok: i === 0 }; });
      return { src: q, opts: shuffle(opts), picked: null };
    });
    state = { qs: qs, i: 0, full: $("q-range").value === "all" && $("q-level").value === "all" && qs.length >= 20 };
    $("setup").hidden = true; $("result").hidden = true; $("play").hidden = false;
    render();
    $("play").scrollIntoView({ block: "start" });
  }
  $("start").addEventListener("click", function () {
    var n = Number($("q-count").value), list = shuffle(pool());
    start(n ? list.slice(0, n) : list);
  });

  function render() {
    var cur = state.qs[state.i], q = cur.src, total = state.qs.length;
    $("bar").style.width = Math.round(state.i / total * 100) + "%";
    $("pos").textContent = "第 " + (state.i + 1) + " 問 / 全 " + total + " 問";
    var h = '<div class="q-card"><div class="q-top"><span>出典：第' + q.c + "章 " + esc(CH[q.c - 1].t) + "</span><span>" + (q.d === 2 ? '<span class="chip warn">応用</span>' : '<span class="chip">基礎</span>') + " Q" + (state.i + 1) + '</span></div><div class="q-text">' + esc(q.q) + '</div><div class="q-opts">';
    cur.opts.forEach(function (o, i) { h += '<button type="button" class="opt-btn" data-i="' + i + '"><span class="mk">' + MK[i] + "</span><span>" + esc(o.t) + "</span></button>"; });
    h += '</div><div id="after"></div></div>';
    $("qbox").innerHTML = h;
    $("qbox").querySelectorAll(".opt-btn").forEach(function (b) {
      b.addEventListener("click", function () { answer(Number(b.getAttribute("data-i"))); });
    });
  }

  function answer(i) {
    var cur = state.qs[state.i];
    if (cur.picked !== null) return;
    cur.picked = i;
    var ok = cur.opts[i].ok;
    $("qbox").querySelectorAll(".opt-btn").forEach(function (b, j) {
      b.disabled = true;
      if (cur.opts[j].ok) b.classList.add("correct");
      else if (j === i) b.classList.add("wrong");
    });
    var last = state.i === state.qs.length - 1;
    $("after").innerHTML = '<div class="q-exp"><span class="rq-result ' + (ok ? "ok" : "ng") + '">' + (ok ? "正解！" : "不正解") + "</span>" + esc(cur.src.e) +
      ' <a href="learn/ch' + String(cur.src.c).padStart(2, "0") + '.html" target="_blank" rel="noopener">→ 第' + cur.src.c + "章を復習</a></div>" +
      '<div class="btn-row"><button type="button" class="btn" id="next">' + (last ? "結果を見る" : "次の問題へ ▶") + "</button></div>";
    $("next").addEventListener("click", function () {
      if (last) return finish();
      state.i++; render();
      $("play").scrollIntoView({ block: "start" });
    });
    $("next").focus({ preventScroll: true });
  }

  function finish() {
    var qs = state.qs, okN = 0, byCh = {};
    qs.forEach(function (x) {
      var ok = x.opts[x.picked].ok; if (ok) okN++;
      var c = x.src.c; byCh[c] = byCh[c] || { n: 0, ok: 0 }; byCh[c].n++; if (ok) byCh[c].ok++;
    });
    var pct = Math.round(okN / qs.length * 100);
    if (state.full) { var b = S.get("ca-quiz-best", 0); if (pct > b) S.set("ca-quiz-best", pct); }
    var hist = S.get("ca-quiz-history", []);
    var chs = {}; Object.keys(byCh).forEach(function (c) { chs[c] = [byCh[c].ok, byCh[c].n]; });
    hist.push({ at: new Date().toISOString(), range: $("q-range").value, level: $("q-level").value, n: qs.length, ok: okN, pct: pct, byCh: chs,
      wrong: qs.filter(function (x) { return !x.opts[x.picked].ok; }).map(function (x) { return x.src.q; }) });
    S.set("ca-quiz-history", hist.slice(-50));
    var msg = pct >= 90 ? "素晴らしい！実務に入る準備ができています。" : pct >= 80 ? "合格ライン到達！苦手な章を仕上げましょう。" : pct >= 60 ? "あと一歩。正答率の低い章を復習しましょう。" : "まずは各章の振り返り問題から復習しましょう。";
    var h = '<div class="card"><div class="eyebrow">RESULT</div><div class="score-big">' + pct + '<span style="font-size:20px">%</span></div><p>' + okN + " / " + qs.length + " 問正解｜" + msg + "</p>";
    h += "<h4>章別の正答率</h4>";
    Object.keys(byCh).map(Number).sort(function (a, b) { return a - b; }).forEach(function (c) {
      var r = byCh[c], p = Math.round(r.ok / r.n * 100);
      h += '<div class="bar-row"><a href="learn/ch' + String(c).padStart(2, "0") + '.html">第' + c + "章 " + esc(CH[c - 1].t) + '</a><div class="progress"><span style="width:' + p + "%;background:" + (p >= 80 ? "var(--ok)" : p >= 50 ? "var(--warn)" : "var(--ng)") + '"></span></div><span class="small">' + r.ok + "/" + r.n + "</span></div>";
    });
    var wrong = qs.filter(function (x) { return !x.opts[x.picked].ok; });
    h += '<div class="btn-row">' + (wrong.length ? '<button type="button" class="btn" id="retry">間違えた ' + wrong.length + " 問だけ再挑戦（順番は再シャッフル）</button>" : "") +
      '<button type="button" class="btn ghost" id="again">新しくランダム出題</button></div></div>';
    if (wrong.length) {
      h += "<h3>間違えた問題の振り返り</h3>";
      wrong.forEach(function (x) {
        var right = x.opts.filter(function (o) { return o.ok; })[0].t;
        h += '<div class="q-card"><div class="q-top"><span>第' + x.src.c + "章</span></div><div class=\"q-text\">" + esc(x.src.q) + '</div><p class="small"><span class="chip ng">あなたの回答</span>' + esc(x.opts[x.picked].t) + '<br><span class="chip ok">正解</span>' + esc(right) + '</p><div class="q-exp">' + esc(x.src.e) + "</div></div>";
      });
    }
    $("result").innerHTML = h;
    $("play").hidden = true; $("result").hidden = false;
    $("result").scrollIntoView({ block: "start" });
    var r = $("retry"); if (r) r.addEventListener("click", function () { start(wrong.map(function (x) { return x.src; })); });
    $("again").addEventListener("click", function () { $("result").hidden = true; $("setup").hidden = false; info(); window.scrollTo(0, 0); });
  }
})();
</script>
<script type="text/plain" id="js-report">
(function () {
  "use strict";
  var S = window.CA_STORE, R = window.CA_RECORDS, CH = window.CA_SITE.chapters;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function bar(p) { return '<div class="progress"><span style="width:' + p + "%;background:" + (p >= 80 ? "var(--ok)" : p >= 50 ? "var(--warn)" : "var(--ng)") + '"></span></div>'; }
  function d(iso) { try { return new Date(iso).toLocaleString("ja-JP"); } catch (e) { return iso; } }

  var lr = S.get("ca-learner", { name: "", id: "" });
  $("ln").value = lr.name || ""; $("lid").value = lr.id || "";
  function saveLearner() { S.set("ca-learner", { name: $("ln").value.trim(), id: $("lid").value.trim() }); }
  $("ln").addEventListener("input", saveLearner); $("lid").addEventListener("input", saveLearner);

  function render() {
    var r = R.collect(), h = "";
    // 章
    var nd = CH.filter(function (c) { return r.chaptersDone[c.id]; }).length;
    h += '<h2>学びフェーズ</h2><p>完了：<strong>' + nd + " / " + CH.length + "</strong> 章</p>" + bar(Math.round(nd / CH.length * 100));
    h += '<div class="grid">' + CH.map(function (c, i) {
      return '<a class="card" href="learn/' + c.id + '.html" style="padding:10px 14px"><span class="small">第' + (i + 1) + "章 " + esc(c.t) + "</span> " + (r.chaptersDone[c.id] ? '<span class="chip ok">完了</span>' : '<span class="chip">未完了</span>') + "</a>";
    }).join("") + "</div>";
    // クイズ
    h += "<h2>総まとめ練習問題</h2>";
    if (!r.quizHistory.length) h += '<p class="muted">まだ受験記録がありません。<a href="quiz.html">挑戦する</a></p>';
    else {
      h += "<p>自己ベスト（全章・全難易度・20問以上）：<strong>" + (r.quizBest === null ? "—" : r.quizBest + "%") + "</strong>｜受験回数：" + r.quizHistory.length + "回</p>";
      h += '<div class="table-wrap"><table><thead><tr><th>日時</th><th>範囲</th><th>難易度</th><th>結果</th></tr></thead><tbody>' +
        r.quizHistory.slice(-10).reverse().map(function (x) { return "<tr><td>" + d(x.at) + "</td><td>" + esc(x.range === "all" ? "全章" : "第" + x.range + "章") + "</td><td>" + ({ all: "すべて", "1": "基礎", "2": "応用" }[x.level] || "すべて") + "</td><td>" + x.ok + "/" + x.n + "（" + x.pct + "%）</td></tr>"; }).join("") + "</tbody></table></div>";
      var acc = R.chapterAccuracy(r.quizHistory);
      h += "<h3>章別の累計正答率（苦手の把握）</h3>";
      Object.keys(acc).map(Number).sort(function (a, b) { return a - b; }).forEach(function (c) {
        var p = Math.round(acc[c][0] / acc[c][1] * 100);
        h += '<div class="bar-row"><a href="learn/ch' + String(c).padStart(2, "0") + '.html">第' + c + "章 " + esc(CH[c - 1] ? CH[c - 1].t : "") + "</a>" + bar(p) + '<span class="small">' + p + "%</span></div>";
      });
    }
    // ケース
    h += "<h2>ケーススタディ</h2>";
    var ids = Object.keys(r.caseRecords);
    if (!ids.length) h += '<p class="muted">まだ採点記録がありません。<a href="cases.html">挑戦する</a></p>';
    else h += '<div class="table-wrap"><table><thead><tr><th>ケース</th><th>最新の得点</th><th>自己ベスト</th><th>採点日時</th></tr></thead><tbody>' +
      ids.sort().map(function (k) { var c = r.caseRecords[k]; return "<tr><td>" + esc(c.title) + "</td><td>" + c.score + "/" + c.max + "（" + c.pct + "%）</td><td>" + (r.caseBest[k] != null ? r.caseBest[k] + "%" : "—") + "</td><td>" + d(c.at) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    // ハンズオン
    h += "<h2>ハンズオン（第16章）</h2>";
    Object.keys(r.handsOn).forEach(function (k) {
      var v = r.handsOn[k], p = Math.round(v[0] / v[1] * 100);
      h += '<div class="bar-row"><span>' + esc(R.LAB_NAMES[k]) + "</span>" + bar(p) + '<span class="small">' + v[0] + "/" + v[1] + "</span></div>";
    });
    // 講師コメント
    if (r.trainerReview) {
      var tr = r.trainerReview;
      h += '<h2>講師からの採点・コメント</h2><div class="callout goal"><span class="ttl">' + esc(tr.trainer || "講師") + "（" + d(tr.at) + "）</span><p>" + esc(tr.overall || "").replace(/\n/g, "<br>") + "</p></div>";
      Object.keys(tr.cases || {}).forEach(function (k) {
        var c = tr.cases[k];
        h += '<div class="card" style="margin:10px 0"><strong>' + esc(c.title || k) + "</strong>：講師採点 " + c.score + "/" + c.max + "点";
        (c.essays || []).forEach(function (e) { if (e && e.comment) h += '<p class="small"><span class="chip acc">' + esc(e.q.slice(0, 30)) + "…</span> " + esc(e.comment) + "</p>"; });
        h += "</div>";
      });
    }
    $("out").innerHTML = h;
  }

  $("dl").addEventListener("click", function () {
    saveLearner();
    var r = R.collect();
    if (!r.learner.name) { $("msg").textContent = "氏名を入力してください。"; $("ln").focus(); return; }
    var day = new Date().toISOString().slice(0, 10);
    R.download("cyberark-report_" + R.safeName(r.learner.id) + "_" + day + ".json", JSON.stringify(r, null, 2));
    $("msg").textContent = "提出用ファイルを作成しました。講師の指定する方法で提出してください。";
  });

  var pending = null;
  function stage(x) {
    if (!x || x._error) { $("msg").textContent = "読み込めませんでした：" + (x ? x._error : ""); return; }
    pending = x;
    $("msg").textContent = "「" + ((x.learner || {}).name || "無記名") + "」の記録を読み込む準備ができました。このブラウザの記録は上書きされます。";
    $("applyimp").hidden = false;
  }
  function applyImport() {
    var x = pending; if (!x) return;
    S.set("ca-learner", x.learner || {}); S.set("ca-done", x.chaptersDone || {});
    S.set("ca-quiz-history", x.quizHistory || []); if (x.quizBest != null) S.set("ca-quiz-best", x.quizBest);
    S.set("ca-case-records", x.caseRecords || {}); Object.keys(x.caseBest || {}).forEach(function (k) { S.set("ca-case-" + k, x.caseBest[k]); });
    S.set("ca-check", x.checks || {}); S.set("ca-trainer-review", x.trainerReview || null);
    $("ln").value = (x.learner || {}).name || ""; $("lid").value = (x.learner || {}).id || "";
    $("msg").textContent = "読み込みました" + (x.trainerReview ? "（講師コメントあり）" : "") + "。";
    $("applyimp").hidden = true; pending = null;
    render();
  }
  $("imp").addEventListener("change", function (e) {
    R.readFiles(e.target.files, function (list) { stage(list[0]); });
    e.target.value = "";
  });
  $("pastebtn").addEventListener("click", function () { stage(R.parseText($("pastearea").value.trim())); });
  R.twoStep($("applyimp"), "本当に上書きする（もう一度押す）", applyImport);
  R.twoStep($("clear"), "本当に消去する（もう一度押す）", function () {
    ["ca-done", "ca-quiz-best", "ca-quiz-history", "ca-case-records", "ca-check", "ca-trainer-review", "ca-quiz-lastorder", "ca-case-B1", "ca-case-B2", "ca-case-B3", "ca-case-B4", "ca-case-A1", "ca-case-A2", "ca-case-A3"].forEach(function (k) { try { localStorage.removeItem(k); } catch (err) { /* noop */ } });
    $("msg").textContent = "消去しました。"; render();
  });

  render();
})();
</script>
<script type="text/plain" id="js-trainer">
(function () {
  "use strict";
  var R = window.CA_RECORDS, CH = window.CA_SITE.chapters, S = window.CA_STORE;
  var $ = function (id) { return document.getElementById(id); };
  var data = [];
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function d(iso) { try { return new Date(iso).toLocaleString("ja-JP"); } catch (e) { return iso; } }
  $("tname").value = S.get("ca-trainer-name", "");
  $("tname").addEventListener("input", function () { S.set("ca-trainer-name", $("tname").value); });

  function summary(x) {
    var done = CH.filter(function (c) { return (x.chaptersDone || {})[c.id]; }).length;
    var hist = x.quizHistory || [], last = hist[hist.length - 1];
    var acc = R.chapterAccuracy(hist), weak = Object.keys(acc).filter(function (c) { return acc[c][1] >= 2 && acc[c][0] / acc[c][1] < 0.7; }).map(function (c) { return "第" + c + "章"; });
    var cr = x.caseRecords || {}, ks = Object.keys(cr), avg = ks.length ? Math.round(ks.reduce(function (s, k) { return s + cr[k].pct; }, 0) / ks.length) : null;
    var lab = 0, labMax = 0; Object.keys(x.handsOn || {}).forEach(function (k) { lab += x.handsOn[k][0]; labMax += x.handsOn[k][1]; });
    return { name: (x.learner || {}).name || "(無記名)", id: (x.learner || {}).id || "", done: done, best: x.quizBest, last: last ? last.pct : null, tries: hist.length, weak: weak, caseN: ks.length, caseAvg: avg, lab: lab, labMax: labMax, at: x.exportedAt };
  }

  function renderOverview() {
    if (!data.length) { $("overview").innerHTML = ""; return; }
    var h = '<h2>2. 受講者一覧</h2><div class="table-wrap"><table><thead><tr><th>氏名</th><th>章完了</th><th>総まとめ<br>最高/最新</th><th>弱点章（累計70%未満）</th><th>ケース<br>(件数/平均)</th><th>ハンズオン</th><th>提出日時</th><th></th></tr></thead><tbody>';
    data.forEach(function (x, i) {
      var s = summary(x);
      h += "<tr><td>" + esc(s.name) + '<br><span class="small muted">' + esc(s.id) + "</span></td><td>" + s.done + "/" + CH.length + "</td><td>" + (s.best == null ? "—" : s.best + "%") + " / " + (s.last == null ? "—" : s.last + "%") + "</td><td>" + (s.weak.length ? '<span class="chip ng">' + s.weak.join("</span> <span class=\"chip ng\">") + "</span>" : '<span class="muted">なし</span>') + "</td><td>" + s.caseN + "/" + (s.caseAvg == null ? "—" : s.caseAvg + "%") + "</td><td>" + s.lab + "/" + s.labMax + "</td><td class=\"small\">" + d(s.at) + '</td><td><button type="button" class="btn sm" data-i="' + i + '">採点</button></td></tr>';
    });
    h += "</tbody></table></div>";
    $("overview").innerHTML = h;
    $("overview").querySelectorAll("button[data-i]").forEach(function (b) { b.addEventListener("click", function () { renderDetail(Number(b.getAttribute("data-i"))); }); });
  }

  function renderDetail(i) {
    var x = data[i], s = summary(x);
    var rv = x._review || (x._review = { trainer: $("tname").value, overall: "", cases: {} });
    var h = "<h2>3. 採点：" + esc(s.name) + "</h2>";
    var cr = x.caseRecords || {};
    var ids = Object.keys(cr).sort();
    if (!ids.length) h += '<p class="muted">ケーススタディの回答記録がありません。</p>';
    ids.forEach(function (k) {
      var c = cr[k];
      var auto = 0, essayMax = 0;
      h += '<details class="case" open data-k="' + k + '"><summary><h3>' + esc(c.title) + '</h3><span class="chip">自己採点 ' + c.score + "/" + c.max + '</span><span class="chip acc" data-tscore="' + k + '"></span></summary><div class="case-body">';
      (c.qs || []).forEach(function (q, qi) {
        h += '<div class="cq"><div class="cq-h">' + esc(q.q) + '<span class="cq-pts">' + q.pts + "点</span></div>";
        if (q.type === "essay") {
          essayMax += q.pts;
          var prev = ((rv.cases[k] || {}).essays || [])[qi] || {};
          h += '<p class="small"><strong>回答：</strong></p><pre style="white-space:pre-wrap">' + esc(q.text || "（未記入）") + '</pre><ul class="rubric">';
          (q.rubric || []).forEach(function (r, ri) {
            var on = prev.checks ? prev.checks[ri] : r.checked;
            h += '<li><input type="checkbox" data-k="' + k + '" data-q="' + qi + '" data-r="' + ri + '" value="' + r.pts + '"' + (on ? " checked" : "") + "><span>" + esc(r.item) + ' <span class="chip">' + r.pts + "点</span>" + (r.checked ? ' <span class="chip ok">本人✓</span>' : "") + "</span></li>";
          });
          h += '</ul><label class="small">講師コメント<textarea data-k="' + k + '" data-q="' + qi + '" class="cmt" style="min-height:70px">' + esc(prev.comment || "") + "</textarea></label>";
        } else {
          auto += q.got;
          h += '<p class="small">回答：' + esc((q.resp || []).join("／") || "（未回答）") + '</p><p class="small"><span class="chip ' + (q.got === q.pts ? "ok" : q.got ? "warn" : "ng") + '">自動採点 ' + q.got + "/" + q.pts + "点</span></p>";
        }
        h += "</div>";
      });
      h += '</div></details>';
      rv.cases[k] = rv.cases[k] || { title: c.title, max: c.max, auto: auto, essays: [] };
      rv.cases[k].auto = auto; rv.cases[k].max = c.max; rv.cases[k].title = c.title;
    });
    h += '<h3>総評</h3><textarea id="overall" style="width:100%;min-height:100px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text)">' + esc(rv.overall) + "</textarea>";
    h += '<div class="btn-row"><button type="button" class="btn" id="save">採点済みファイルをダウンロード（受講者へ返却）</button></div>';
    $("detail").innerHTML = h;

    function recompute() {
      Object.keys(rv.cases).forEach(function (k) {
        var c = cr[k], ess = [];
        (c.qs || []).forEach(function (q, qi) {
          if (q.type !== "essay") return;
          var checks = [], sc = 0;
          $("detail").querySelectorAll('input[data-k="' + k + '"][data-q="' + qi + '"]').forEach(function (cb) { checks.push(cb.checked); if (cb.checked) sc += Number(cb.value); });
          var cm = $("detail").querySelector('textarea.cmt[data-k="' + k + '"][data-q="' + qi + '"]');
          ess[qi] = { q: q.q, checks: checks, score: Math.min(sc, q.pts), comment: cm ? cm.value : "" };
        });
        rv.cases[k].essays = ess;
        rv.cases[k].score = rv.cases[k].auto + ess.reduce(function (a, e) { return a + (e ? e.score : 0); }, 0);
        var chip = $("detail").querySelector('[data-tscore="' + k + '"]');
        if (chip) chip.textContent = "講師採点 " + rv.cases[k].score + "/" + rv.cases[k].max;
      });
      rv.overall = $("overall").value;
      rv.trainer = $("tname").value;
    }
    $("detail").onchange = recompute;
    $("detail").oninput = recompute;
    recompute();
    $("save").addEventListener("click", function () {
      recompute();
      rv.at = new Date().toISOString();
      var out = JSON.parse(JSON.stringify(x)); delete out._review; delete out._file;
      out.trainerReview = rv;
      R.download("cyberark-graded_" + R.safeName(s.id) + "_" + rv.at.slice(0, 10) + ".json", JSON.stringify(out, null, 2));
    });
    $("detail").scrollIntoView({ block: "start" });
  }

  $("files").addEventListener("change", function (e) {
    R.readFiles(e.target.files, function (list) {
      var errs = list.filter(function (x) { return x._error; }).map(function (x) { return x._error; });
      data = data.concat(list.filter(function (x) { return !x._error; }));
      $("msg").textContent = data.length + "名分を読み込みました。" + (errs.length ? "読み込めなかったファイル：" + errs.join("、") : "");
      $("csv").disabled = !data.length;
      renderOverview();
    });
    e.target.value = "";
  });

  $("tpastebtn").addEventListener("click", function () {
    var x = R.parseText($("tpaste").value.trim());
    if (x._error) { $("msg").textContent = "読み込めませんでした：" + x._error; return; }
    data.push(x); $("tpaste").value = "";
    $("msg").textContent = data.length + "名分を読み込みました。"; $("csv").disabled = false; renderOverview();
  });

  $("csv").addEventListener("click", function () {
    var rows = [["氏名", "社員番号", "章完了", "総まとめ最高%", "総まとめ最新%", "受験回数", "弱点章", "ケース件数", "ケース平均%", "ハンズオン完了", "ハンズオン項目数", "提出日時"]];
    data.forEach(function (x) { var s = summary(x); rows.push([s.name, s.id, s.done, s.best == null ? "" : s.best, s.last == null ? "" : s.last, s.tries, s.weak.join(" "), s.caseN, s.caseAvg == null ? "" : s.caseAvg, s.lab, s.labMax, s.at]); });
    var csv = "﻿" + rows.map(function (r) { return r.map(function (v) { v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(","); }).join("\r\n");
    R.download("cyberark-training-summary_" + new Date().toISOString().slice(0, 10) + ".csv", csv, "text/csv");
  });
})();

<script>
(function () {
  "use strict";
  var api = null;
  var titles = window.CA_TITLES || {};
  // "learn/ch03.html" "../cases.html#case-B1" "ch04.html" などをページ名に正規化する
  function pageOf(href) {
    if (!href) return null;
    var m = href.replace(/^(\.\.\/)+/, "").replace(/^learn\//, "").match(/^([a-z0-9]+)\.html(#.*)?$/);
    if (!m || !document.getElementById("tpl-" + m[1])) return null;
    return { name: m[1], anchor: m[2] ? m[2].slice(1) : "" };
  }
  function pathOf(name) { return /^ch\d\d$/.test(name) ? "learn/" + name + ".html" : name + ".html"; }
  function show(name, anchor, fromHash) {
    var tpl = document.getElementById("tpl-" + name);
    if (!tpl) { name = "index"; tpl = document.getElementById("tpl-index"); }
    var content = document.querySelector("main .content");
    content.innerHTML = tpl.innerHTML;
    api.setCurrent(pathOf(name));
    document.title = titles[name] || "CyberArk 新人研修";
    var code = document.getElementById("js-" + name);
    api.buildPage();
    if (code) { try { (new Function(code.textContent))(); } catch (e) { if (window.console) console.error(e); } }
    if (!fromHash) { try { history.replaceState(null, "", "#" + name); } catch (e) { /* ファイル表示などで履歴を書き換えられない場合はそのまま */ } }
    var target = anchor && document.getElementById(anchor);
    if (target && target.scrollIntoView) target.scrollIntoView(); else window.scrollTo(0, 0);
  }
  function fromLocation() {
    var h = (location.hash || "").slice(1);
    return document.getElementById("tpl-" + h) ? h : "index";
  }
  window.CA_BUNDLE = {
    start: function (a) {
      api = a;
      document.addEventListener("click", function (e) {
        var link = e.target.closest ? e.target.closest("a[href]") : null;
        if (!link || link.target === "_blank") return;
        var href = link.getAttribute("href");
        if (href.charAt(0) === "#") {
          var el = document.getElementById(href.slice(1));
          if (el) { e.preventDefault(); el.scrollIntoView(); }
          return;
        }
        var p = pageOf(href);
        if (p) { e.preventDefault(); show(p.name, p.anchor); }
      });
      window.addEventListener("hashchange", function () { show(fromLocation(), "", true); });
      show(fromLocation(), "", true);
    }
  };
})();
</script>
<script>
/* =========================================================
   学習記録の収集・書き出し・読み込み（受講者／講師ページ共通）
   サーバを使わず、JSONファイルの受け渡しで提出・採点する
   ========================================================= */
(function () {
  "use strict";
  var SCHEMA = "ca-training-report/1";
  // 第16章ハンズオンのチェック項目数（章の構成を変えたら合わせて更新する）
  var LABS = { lab1: 4, lab2: 5, lab3: 6, lab4: 5, lab5: 4, lab6: 4, lab7: 3, lab8: 3, labclean: 4 };
  var LAB_NAMES = { lab1: "演習1 画面ツアー", lab2: "演習2 Safe作成", lab3: "演習3 アカウント登録", lab4: "演習4 PSM接続・録画", lab5: "演習5 二重承認", lab6: "演習6 不一致からの復旧", lab7: "演習7 CPMエラー切り分け", lab8: "演習8 REST API", labclean: "後片付け" };

  function S() { return window.CA_STORE; }

  function labProgress(check) {
    var out = {};
    Object.keys(LABS).forEach(function (k) {
      var n = 0;
      for (var i = 0; i < LABS[k]; i++) if (check[k + "-" + i]) n++;
      out[k] = [n, LABS[k]];
    });
    return out;
  }

  // 全クイズ履歴から章別の累計正答率を出す
  function chapterAccuracy(hist) {
    var acc = {};
    (hist || []).forEach(function (h) {
      Object.keys(h.byCh || {}).forEach(function (c) {
        acc[c] = acc[c] || [0, 0];
        acc[c][0] += h.byCh[c][0]; acc[c][1] += h.byCh[c][1];
      });
    });
    return acc;
  }

  function collect() {
    var st = S();
    return {
      schema: SCHEMA,
      learner: st.get("ca-learner", { name: "", id: "" }),
      exportedAt: new Date().toISOString(),
      chaptersDone: st.get("ca-done", {}),
      quizBest: st.get("ca-quiz-best", null),
      quizHistory: st.get("ca-quiz-history", []),
      caseBest: (function () { var o = {}; ["B1", "B2", "B3", "B4", "A1", "A2", "A3"].forEach(function (k) { var v = st.get("ca-case-" + k, null); if (v !== null) o[k] = v; }); return o; })(),
      caseRecords: st.get("ca-case-records", {}),
      handsOn: labProgress(st.get("ca-check", {})),
      checks: st.get("ca-check", {}),
      trainerReview: st.get("ca-trainer-review", null)
    };
  }

  // ダウンロードに加え、ダウンロードできない環境（スマホのファイル表示・埋め込み表示など）向けに
  // 内容をコピーできる欄を表示する
  function download(name, text, type) {
    try {
      var blob = new Blob([text], { type: type || "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    } catch (e) { /* コピー欄で代替 */ }
    showCopyBox(name, text);
  }

  function showCopyBox(name, text) {
    var box = document.getElementById("copybox");
    if (!box) {
      box = document.createElement("div"); box.id = "copybox"; box.className = "card";
      box.style.margin = "14px 0";
      var anchor = document.getElementById("msg");
      (anchor ? anchor.parentNode : document.querySelector(".content")).appendChild(box);
    }
    box.innerHTML = '<p class="small"><strong>' + name.replace(/[<>&]/g, "") + '</strong>：ダウンロードが始まらない場合は、下の内容をコピーしてメールやチャットで送ってください（受け取った側は「貼り付けて読み込む」で取り込めます）。</p>' +
      '<textarea id="copytext" readonly style="width:100%;min-height:120px;font-family:var(--mono);font-size:12px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--text)"></textarea>' +
      '<div class="btn-row"><button type="button" class="btn sm" id="copybtn">内容をコピー</button><span class="small" id="copymsg"></span></div>';
    var ta = box.querySelector("#copytext"); ta.value = text;
    box.querySelector("#copybtn").addEventListener("click", function () {
      var done = function () { box.querySelector("#copymsg").textContent = "コピーしました"; };
      var fallback = function () { ta.focus(); ta.select(); box.querySelector("#copymsg").textContent = "全体を選択しました。コピー操作をしてください"; };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });
  }

  // 貼り付けたテキスト（JSON）を読み込む
  function parseText(text, label) {
    try { var d = JSON.parse(text); if (d.schema === SCHEMA) { d._file = label || "貼り付け"; return d; } return { _error: (label || "貼り付け") + "：形式が違います" }; }
    catch (e) { return { _error: (label || "貼り付け") + "：JSONとして読めません" }; }
  }

  // confirm() が使えない環境でも動く2段階確認ボタン
  function twoStep(btn, armedLabel, action) {
    var label = btn.textContent, armed = false, timer = null;
    btn.addEventListener("click", function () {
      if (!armed) {
        armed = true; btn.textContent = armedLabel; btn.classList.remove("ghost");
        timer = setTimeout(function () { armed = false; btn.textContent = label; btn.classList.add("ghost"); }, 5000);
        return;
      }
      clearTimeout(timer); armed = false; btn.textContent = label; btn.classList.add("ghost");
      action();
    });
  }

  function readFiles(files, cb) {
    var out = [], left = files.length;
    if (!left) return cb(out);
    Array.prototype.forEach.call(files, function (f) {
      var r = new FileReader();
      r.onload = function () {
        try { var d = JSON.parse(r.result); if (d.schema === SCHEMA) { d._file = f.name; out.push(d); } else out.push({ _error: f.name + "：形式が違います" }); }
        catch (e) { out.push({ _error: f.name + "：JSONとして読めません" }); }
        if (--left === 0) cb(out);
      };
      r.readAsText(f);
    });
  }

  // 環境によって非ASCIIのファイル名が無視されるため、ファイル名は英数字のみにする（氏名はファイル内に保存）
  function safeName(s) { var v = String(s || "").replace(/[^A-Za-z0-9_-]+/g, ""); return v || "learner"; }

  window.CA_RECORDS = { SCHEMA: SCHEMA, LABS: LABS, LAB_NAMES: LAB_NAMES, collect: collect, download: download, readFiles: readFiles, parseText: parseText, twoStep: twoStep, chapterAccuracy: chapterAccuracy, labProgress: labProgress, safeName: safeName };
})();

</script>
